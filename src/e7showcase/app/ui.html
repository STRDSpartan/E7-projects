<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E7 Showcase</title>
<style>
:root { --bg:#0b0e15; --panel:#141925; --panel-2:#1b2130; --line:#283044; --text:#e8ecf3; --muted:#8e98aa;
  --gold:#e8c26a; --accent:#4ab3ff; --danger:#e26060; --ok:#7fe0a0; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif;
  display:grid; grid-template-columns: 260px minmax(0,1fr); height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.brand { padding:16px; font-weight:800; letter-spacing:.06em; color:var(--gold); font-size:17px; }
.brand small { display:block; color:var(--muted); font-weight:400; letter-spacing:0; font-size:12px; }
.list { flex:1; overflow:auto; padding:0 8px; }
.list h3 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:14px 8px 6px; letter-spacing:.08em; }
.item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); padding:8px 10px;
  border-radius:8px; cursor:pointer; }
.item:hover { background:var(--panel-2); } .item.active { background:#22304c; }
.item small { display:block; color:var(--muted); }
.side-actions { padding:12px; display:grid; gap:8px; border-top:1px solid var(--line); }
button { font:inherit; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--gold); color:#1d1606; font-weight:600; }
button.ghost { background:var(--panel-2); color:var(--text); font-weight:500; }
button.danger { background:transparent; color:var(--danger); border:1px solid #5a2a2a; }
button:disabled { opacity:.5; cursor:default; }
main { display:flex; flex-direction:column; min-height:0; }
.bar { display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar h1 { margin:0; font-size:20px; flex:1; min-width:0; }
.bar h1 input { background:transparent; border:1px solid transparent; color:var(--text); font:inherit; font-weight:700; width:100%; padding:2px 6px; border-radius:6px; }
.bar h1 input:hover, .bar h1 input:focus { border-color:var(--line); outline:none; }
.badge { font-size:12px; color:var(--accent); border:1px solid #2a4b6b; border-radius:999px; padding:2px 10px; }
.drop { margin:12px 16px 0; border:2px dashed var(--line); border-radius:12px; padding:14px; text-align:center; color:var(--muted); cursor:pointer; }
.drop.over { border-color:var(--gold); color:var(--text); background:#1a1c14; }
.report { margin:8px 16px 0; font-size:13px; }
.report .transient { transition: opacity .6s ease; } .report .fading { opacity: 0; }
.report .ok { color:var(--ok); } .report .warn { color:var(--gold); } .report .err { color:var(--danger); }
.progress { margin:10px 16px 0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.progress .head { display:flex; justify-content:space-between; gap:12px; font-size:13px; margin-bottom:8px; }
.progress .head b { color:var(--gold); font-variant-numeric:tabular-nums; }
.progress .msg { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track { height:12px; background:#0f131c; border-radius:999px; overflow:hidden; border:1px solid #232a3b; }
.fill { height:100%; width:0; border-radius:999px; transition:width .45s ease;
  background:linear-gradient(90deg, #b8892f, var(--gold) 50%, #fff0c2);
  background-size:200% 100%; position:relative; animation:shine 2.2s linear infinite; }
.fill::after { content:""; position:absolute; inset:0; border-radius:inherit;
  background:repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px);
  background-size:28px 28px; animation:stripes .8s linear infinite; }
.progress.done .fill { animation:none; background:var(--ok); } .progress.done .fill::after { display:none; }
.progress .heroes { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.progress .heroes span { font-size:12px; background:#1f2a1f; color:var(--ok); border-radius:999px; padding:2px 10px; animation:pop .35s ease; }
@keyframes stripes { to { background-position:28px 0; } }
@keyframes shine { to { background-position:-200% 0; } }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .fill, .fill::after, .progress .heroes span { animation:none; } }
iframe { flex:1; border:0; width:100%; margin-top:10px; background:var(--bg); }
.empty { margin:auto; text-align:center; color:var(--muted); max-width:520px; padding:24px; }
.empty h2 { color:var(--text); }
.sim { padding:16px; overflow:auto; display:grid; gap:14px; align-content:start; }
.tabs { display:flex; gap:6px; } .tabs button { background:var(--panel-2); color:var(--text); font-weight:500; }
.tabs button[aria-pressed="true"] { background:var(--gold); color:#1d1606; font-weight:700; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:15px; color:var(--gold); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
.field { display:grid; gap:4px; font-size:13px; color:var(--muted); }
.field select, .field input { width:100%; min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; }
.checks { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; }
table.res { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
table.res th, table.res td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:right; }
table.res th:first-child, table.res td:first-child { text-align:left; }
table.res td.crit { color:var(--gold); font-weight:700; } table.res td.exp { color:var(--ok); font-weight:700; }
.note { font-size:12px; color:var(--muted); }
.wins { display:flex; height:28px; border-radius:8px; overflow:hidden; font-weight:700; font-size:13px; }
.wins div { display:grid; place-items:center; min-width:0; overflow:hidden; white-space:nowrap; }
.log { font:12.5px/1.6 ui-monospace, Consolas, monospace; background:#0d111a; border:1px solid var(--line); border-radius:8px;
  padding:10px; max-height:360px; overflow:auto; white-space:pre-wrap; }
.empty ol { text-align:left; }
dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:18px; }
dialog input { width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; margin:10px 0; font:inherit; }
.topnav { display:flex; gap:4px; padding:10px 16px 0; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
.topnav button { background:transparent; color:var(--muted); font-weight:600; border-radius:8px 8px 0 0; padding:9px 16px; border-bottom:2px solid transparent; }
.topnav button:hover { color:var(--text); background:var(--panel-2); }
.topnav button[aria-selected="true"] { color:var(--gold); border-bottom-color:var(--gold); background:var(--bg); }
#content { flex:1; display:flex; flex-direction:column; min-height:0; overflow:auto; }
.page { padding:16px; display:grid; gap:14px; align-content:start; }
.filters { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
.filters select, .filters input, .bar h1 input[aria-label="Nom de la guilde"] { min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:2px 10px 2px 4px; }
.chip img { width:20px; height:20px; }
.gear-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
.gear { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; gap:6px; }
.gear.free { border-color:#3c5a3c; }
.gear .top { display:flex; gap:10px; align-items:center; }
.gear .icon { width:56px; height:56px; border-radius:10px; background:var(--panel-2); display:grid; place-items:center; flex:none; overflow:hidden; position:relative; }
.gear .icon img.main { width:100%; height:100%; object-fit:cover; }
.gear .icon img.shield { position:absolute; right:-2px; bottom:-2px; width:24px; height:24px; }
.gear .title { font-weight:700; } .gear .title b { color:var(--gold); }
.gear .owner { font-size:12px; color:var(--muted); } .gear.free .owner { color:var(--ok); }
.gear ul { margin:0; padding:0; list-style:none; font-size:13px; display:grid; gap:2px; font-variant-numeric:tabular-nums; }
.gear li { display:flex; justify-content:space-between; gap:8px; } .gear li.main { color:var(--gold); font-weight:600; }
.gear .del { justify-self:end; padding:3px 10px; font-size:12px; }
.rank-epic { color:#e26060; } .rank-heroic { color:#c58cff; } .rank-rare { color:#4ab3ff; } .rank-good { color:#7fe0a0; }
table.members { width:100%; border-collapse:collapse; }
table.members th, table.members td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
table.members td.num { text-align:right; font-variant-numeric:tabular-nums; }
table.members td .acts { display:flex; gap:6px; flex-wrap:wrap; }
table.members td .acts button { padding:4px 10px; font-size:12px; }
.team { display:grid; grid-template-columns:repeat(3, minmax(90px, 1fr)); gap:6px; }
.team select, .team input, .page .card > input, .grid2 .field input { min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
table.gvg td { min-width:120px; }
table.gvg input { width:100%; min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
.note[role="status"]:empty { display:none; }
.wide { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:12px; }
.page .card > input[type="search"] { width:100%; }
.simbox > select { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
.autosend { display:flex; gap:8px; align-items:flex-start; font-size:13px; }
.autosend input { margin-top:3px; flex:none; }
.simbox { display:grid; gap:8px; margin-top:10px; justify-items:start; } .simbox > div { width:100%; }
.simbox .wins { margin-top:4px; }
.stat-tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
.tile b { display:block; font-size:22px; color:var(--gold); font-variant-numeric:tabular-nums; } .tile span { font-size:12px; color:var(--muted); }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); } aside { max-height: 40vh; } }
</style>
</head>
<body>
<aside>
  <div class="brand">E7 SHOWCASE<small>Vitrines Epic Seven</small></div>
  <div class="list" id="list"></div>
  <div class="side-actions">
    <button id="new">+ Nouveau profil</button>
    <button class="ghost" id="open">Ouvrir une vitrine (.e7v)</button>
    <input type="file" id="open-file" accept=".e7v" hidden>
  </div>
</aside>
<main id="main">
  <nav class="topnav" role="tablist" aria-label="Fonctionnalités">
    <button role="tab" data-tab="vitrine">Vitrine</button>
    <button role="tab" data-tab="sim">Simulateur de combat</button>
    <button role="tab" data-tab="guild">Guilde</button>
    <button role="tab" data-tab="armory">Armurerie</button>
    <button role="tab" data-tab="gvg">GvG</button>
  </nav>
  <div id="content"></div>
</main>

<dialog id="dlg">
  <form id="dlg-form">
    <strong>Nom du joueur</strong>
    <input id="dlg-name" maxlength="40" placeholder="Pseudo en jeu" required>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ghost" id="dlg-cancel">Annuler</button>
      <button type="submit">Créer</button>
    </div>
  </form>
</dialog>

<script>
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);
let profiles = [], current = null, tab = "vitrine";

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: { "X-E7-Token": TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = "Erreur " + res.status;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res;
}
const json = async (m, p, b) => (await api(m, p, b)).json();
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v);
  for (const c of kids) n.append(c);
  return n;
};
const toB64 = (file) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(file); });

async function refresh(select) {
  profiles = await json("GET", "/profiles");
  const list = $("#list"); list.replaceChildren();
  const mine = profiles.filter((p) => !p.received), recv = profiles.filter((p) => p.received);
  for (const [title, group] of [["Mes profils", mine], ["Vitrines reçues", recv]]) {
    if (!group.length) continue;
    list.append(el("h3", {}, title));
    for (const p of group) list.append(el("button", { class: "item" + (p.id === (select || current) ? " active" : ""), "data-id": p.id, onclick: () => selectProfile(p.id) },
      p.player, el("small", {}, `${p.heroes} héros · ${p.updated_at}`)));
  }
  if (select) { current = select; render(); } else if (!current && tab === "vitrine") welcome();
}

function selectProfile(id) {
  current = id;
  if (tab !== "armory") tab = "vitrine";
  render();
}
function setTab(name) { tab = name; render(); }
function render() {
  document.querySelectorAll(".topnav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.querySelectorAll(".item").forEach((b) => b.classList.toggle("active", b.dataset.id === current));
  if (tab === "sim") return simulators();
  if (tab === "guild") return guildPage();
  if (tab === "gvg") return gvgPage();
  if (tab === "armory") return current ? armoryPage(current) : pickFirst("l'armurerie");
  return current ? show(current) : welcome();
}
function pickFirst(what) {
  $("#content").replaceChildren(el("div", { class: "empty" }, el("h2", {}, "Choisissez un profil"),
    el("p", {}, `Sélectionnez un profil dans la liste de gauche pour ouvrir ${what}.`)));
}
document.querySelectorAll(".topnav button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));

function welcome() {
  $("#content").replaceChildren(el("div", { class: "empty" },
    el("h2", {}, "Bienvenue"),
    el("p", {}, "Créez votre profil, puis ajoutez les captures d'écran de vos héros."),
    el("ol", {},
      el("li", {}, "Dans le jeu : Héros → choisissez un héros → bouton sous les bottes → « Infos de héros »."),
      el("li", {}, "Faites une capture (Impr. écran ou Win+Maj+S) pour chaque héros."),
      el("li", {}, "Pour reconnaître les sets, ajoutez aussi une capture de la liste des héros (lignes « Set … »)."),
      el("li", {}, "Glissez toutes les captures dans l'application : la vitrine se construit seule.")),
    el("p", {}, "Quelqu'un vous a envoyé sa vitrine ? « Ouvrir une vitrine (.e7v) ».")));
}

async function show(id) {
  const p = await json("GET", "/profiles/" + id);
  const name = el("input", { value: p.player, maxlength: "40", "aria-label": "Nom du joueur" });
  if (p.received) name.setAttribute("readonly", "");
  else name.addEventListener("change", async () => { await api("PATCH", "/profiles/" + id, { player: name.value }); reloadFrame(); refresh(); });
  const bar = el("div", { class: "bar" }, el("h1", {}, name),
    p.received ? el("span", { class: "badge" }, "Vitrine reçue") : "",
    el("button", { onclick: () => exportVitrine(id, p.player) }, "Exporter la vitrine"),
    el("button", { class: "danger", onclick: () => removeProfile(id, p.player) }, "Supprimer"));
  const kids = [bar];
  const report = el("div", { class: "report", id: "report" });
  if (!p.received) kids.push(...dropZone("Glissez ici vos captures (Infos de héros, liste des héros, objets non équipés) — ou cliquez pour les choisir"));
  kids.push(report);
  if (p.heroes.length) kids.push(el("iframe", { id: "frame", src: "/profile/" + id, title: "Vitrine" }));
  else kids.push(el("div", { class: "empty" }, p.received ? "Cette vitrine ne contient aucun héros." : "Aucun héros pour l'instant : ajoutez vos captures ci-dessus."));
  $("#content").replaceChildren(...kids);
}
function dropZone(text) {
  const input = el("input", { type: "file", accept: "image/png,image/jpeg,image/webp", multiple: "", hidden: "" });
  const drop = el("div", { class: "drop", onclick: () => input.click() }, text);
  input.addEventListener("change", () => importFiles([...input.files]));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); importFiles([...e.dataTransfer.files]); });
  return [drop, input];
}
function reloadFrame() { const f = $("#frame"); if (f) f.src = f.src; }

function progressBox() {
  const fill = el("div", { class: "fill" });
  const pct = el("b", {}, "0 %"), msg = el("span", { class: "msg" }, "Préparation des captures…");
  const heroes = el("div", { class: "heroes" });
  const box = el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100" },
    el("div", { class: "head" }, msg, pct), el("div", { class: "track" }, fill), heroes);
  const seen = new Set();
  return {
    box,
    set(ratio, text) {
      const v = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      fill.style.width = v + "%"; pct.textContent = v + " %"; box.setAttribute("aria-valuenow", v);
      if (text) msg.textContent = text;
    },
    hero(name) { if (!seen.has(name)) { seen.add(name); heroes.append(el("span", {}, "✔ " + name)); } },
    finish() { box.classList.add("done"); },
  };
}

async function importFiles(files) {
  files = files.filter((f) => /\.(png|jpe?g|webp)$/i.test(f.name));
  if (!files.length) return;
  const report = $("#report");
  const bar = progressBox();
  report.replaceChildren(bar.box);
  try {
    // 1) lecture des fichiers (0 → 10 %)
    const encoded = [];
    for (const [i, f] of files.entries()) {
      bar.set((i / files.length) * 0.1, `Préparation ${i + 1}/${files.length} : ${f.name}`);
      encoded.push({ name: f.name, data: await toB64(f) });
    }
    bar.set(0.1, "Envoi des captures…");
    const { job } = await json("POST", `/profiles/${current}/screenshots`, { files: encoded });
    // 2) analyse côté application (10 → 100 %)
    let state;
    for (;;) {
      state = await json("GET", "/jobs/" + job);
      bar.set(0.1 + 0.9 * (state.done / state.total), state.message);
      const m = /^(.+) ajouté$/.exec(state.message);
      if (m) bar.hero(m[1]);
      if (state.finished) break;
      await new Promise((r) => setTimeout(r, 300));
    }
    if (state.error) throw new Error(state.error);
    const r = state.report;
    r.heroes.forEach((h) => bar.hero(h));
    bar.set(1, `Terminé : ${r.heroes.length} héros ajouté(s)` + (r.items.length ? `, ${r.items.length} pièce(s) ajoutée(s) à l'armurerie` : ""));
    bar.finish();
    const lines = [bar.box];
    if (r.items.length) lines.push(el("div", { class: "ok" }, `Armurerie : ${r.items.join(" · ")}`));
    if (r.learned_sets.length) lines.push(el("div", { class: "transient" }, `Sets appris : ${r.learned_sets.join(", ")}`));
    for (const w of r.warnings) lines.push(el("div", { class: "warn" }, "⚠ " + w));
    if (r.ignored.length) lines.push(el("div", { class: "warn" }, `Captures non reconnues : ${r.ignored.join(", ")}`));
    report.replaceChildren(...lines);
    const keep = [...report.childNodes];
    await refresh(); await render(); $("#report")?.replaceChildren(...keep);
    bar.box.classList.add("transient");
    setTimeout(() => {
      const gone = keep.filter((n) => n.classList && n.classList.contains("transient"));
      gone.forEach((n) => n.classList.add("fading"));
      setTimeout(() => gone.forEach((n) => n.remove()), 600);
    }, 5000);
  } catch (e) { report.replaceChildren(el("span", { class: "err" }, e.message)); }
}

async function exportVitrine(id, player) {
  if (window.pywebview?.api?.save_vitrine) {
    const path = await window.pywebview.api.save_vitrine(id);
    if (path) alert("Vitrine enregistrée :\n" + path);
    return;
  }
  const res = await api("GET", `/profiles/${id}/export`);
  const name = (res.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || "vitrine.e7v";
  const url = URL.createObjectURL(await res.blob());
  el("a", { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function removeProfile(id, player) {
  if (!confirm(`Supprimer le profil « ${player} » de cet ordinateur ?`)) return;
  await api("DELETE", "/profiles/" + id); current = null; await refresh(); render();
}

// --- Simulateurs (dégâts, combat) : calculs côté application (calc/damage.py, calc/battle.py)

const SLOTS = { weapon: "Arme", helmet: "Casque", armor: "Armure", necklace: "Collier", ring: "Bague", boots: "Bottes" };

  const card = (g) => {
    const icon = el("div", { class: "icon" }, g.icon ? el("img", { class: "main", src: g.icon, alt: SLOTS[g.slot] }) : SLOT_GLYPH[g.slot] || "?");
    if (g.set && data.sets[g.set]?.icon) icon.append(el("img", { class: "shield", src: data.sets[g.set].icon, alt: "" }));

    const desc = el("div", {}, title, el("div", { class: g.rank ? "rank-" + g.rank : "" , style: "font-size:12px" },
      [g.set ? data.sets[g.set].name : "Set inconnu", g.rank ? RANKS[g.rank] : "", g.level ? `niv. ${g.level}` : ""].filter(Boolean).join(" · ")), sub);

      && (!q || [g.hero, ...[g.main, ...g.substats].map((s) => STATS[s.stat])].some((t) => t && t.toLowerCase().includes(q))));
    const key = { enhance: (g) => -g.enhance, set: (g) => g.set ? data.sets[g.set].name : "~", slot: (g) => Object.keys(SLOTS).indexOf(g.slot), hero: (g) => g.hero || "" }[sort.value];

      el("div", { class: "tile" }, el("b", {}, fmtN(data.inventory.length)), el("span", {}, "de côté (non équipées)"))),
    Object.keys(bySet).length ? el("div", { class: "card" }, el("h3", {}, "Pièces de côté par set"),
      el("div", { class: "chips" }, ...Object.entries(bySet).sort((a, b) => b[1] - a[1]).map(([k, n]) => el("span", { class: "chip" }, shield(k), `${data.sets[k].name} × ${n}`)))) : "",
    el("div", { class: "card" }, el("div", { class: "filters" }, search, slot, set, main, state, sort)),
    counter, grid);
  if (!items.length) page.append(el("div", { class: "empty" }, "Aucune pièce : ajoutez les fiches « Infos de héros » de vos héros, ou des captures de l'infobulle de vos objets non équipés."));
  kids.push(page);
  $("#content").replaceChildren(...kids);
  draw();
}

    try { await json(method, "/gvg" + path, body); status.textContent = "Enregistré."; status.style.color = "var(--ok)"; if (after) after(); }
    catch (e) { status.textContent = e.message; status.style.color = "var(--danger)"; }
  };
  if (!g.members.length) {
    page.append(el("div", { class: "empty" }, el("h2", {}, "Aucun membre"),
      el("p", {}, "Ajoutez d'abord les membres dans l'onglet Guilde (votre profil et les vitrines de vos coéquipiers) : leurs héros servent aux défenses et aux attaques."),
      el("button", { onclick: () => setTab("guild") }, "Ouvrir l'onglet Guilde")));
  } else if (sub === "defense") gvgDefense(page, g, send);
  else if (sub === "wars") gvgWars(page, g, send);

const heroSelect = (heroes, value, label) => {
  const s = el("select", { "aria-label": label }, el("option", { value: "" }, "—"), ...heroes.map((h) => el("option", { value: h }, h)));
  s.value = value || ""; return s;
};
function gvgDefense(page, g, send) {
  const towerList = el("datalist", { id: "gvg-towers" }, ...g.settings.towers.map((t) => el("option", { value: t })));
  const tileMembers = el("b", {}), tileHeroes = el("b", {});
  const counts = () => {
    const picks = rows.map((r) => r.teams.flat().filter((x) => x.value).length);
    tileMembers.textContent = `${picks.filter(Boolean).length}/${g.members.length}`;
    tileHeroes.textContent = fmtN(picks.reduce((a, b) => a + b, 0));
  };
  const rows = g.members.map((m) => {
    const teams = [0, 1].map((ti) => [0, 1, 2].map((i) => heroSelect(m.heroes, m.defense.teams[ti]?.[i], `${m.player} équipe ${ti + 1} héros ${i + 1}`)));
    const tower = el("input", { list: "gvg-towers", value: m.defense.tower || "", placeholder: "Tour", maxlength: "40", "aria-label": `Tour de ${m.player}` });
    const save = () => send("PUT", "/defense/" + m.id, { tower: tower.value, teams: teams.map((t) => t.map((s) => s.value).filter(Boolean)) }, counts);
    [tower, ...teams.flat()].forEach((n) => n.addEventListener("change", save));
    const row = el("tr", {}, el("td", {}, el("strong", {}, m.player), el("div", { class: "note" }, `${m.heroes.length} héros`)),
      el("td", {}, tower), ...teams.map((t) => el("td", {}, el("div", { class: "team" }, ...t))));
    return { row, teams };
  });
  counts();
  const names = el("datalist", { id: "gvg-heroes" }, ...g.hero_names.map((n) => el("option", { value: n })));
  const who = el("select", { "aria-label": "Défense testée" }, ...g.members.flatMap((m, mi) => [0, 1].map((ti) =>
    el("option", { value: `${mi}:${ti}` }, `${m.player} — équipe ${ti + 1}`))));
  const attackers = [0, 1, 2].map((i) => el("input", { list: "gvg-heroes", placeholder: `Attaquant ennemi ${i + 1}`, maxlength: "40" }));
  const defenseTest = el("div", { class: "card" }, el("h3", {}, "Tester une défense"), names,
    el("p", { class: "note" }, "Simule une attaque ennemie supposée (héros aux stats types de leur classe) contre une équipe de défense telle qu'elle est choisie ci-dessus."),
    el("div", { class: "wide" }, field("Défense", who), field("Attaque ennemie", el("div", { class: "team" }, ...attackers))),
    simBox("Simuler", () => {
      const [mi, ti] = who.value.split(":").map(Number);
      const picks = rows[mi].teams[ti].map((s) => s.value).filter(Boolean);
      if (!picks.length) throw new Error("Cette équipe de défense est vide.");
      return { a: asEnemy(attackers.map((i) => i.value)), b: asRefs(g.members[mi].id, picks), labels: ["Attaque", "Défense"] };
    }));
  page.append(
    el("div", { class: "stat-tiles" },
      el("div", { class: "tile" }, tileMembers, el("span", {}, "membres avec une défense")),
      el("div", { class: "tile" }, tileHeroes, el("span", {}, "héros en défense"))),
    el("div", { class: "card" }, el("h3", {}, "Défenses des membres"),
      el("p", { class: "note" }, "Deux équipes de 3 héros par membre (un héros ne défend que dans une équipe). Les choix sont enregistrés aussitôt."),
      towerList,
      el("div", { style: "overflow:auto" }, el("table", { class: "members gvg" },
        el("thead", {}, el("tr", {}, ...["Membre", "Tour", "Équipe 1", "Équipe 2"].map((t) => el("th", {}, t)))), el("tbody", {}, ...rows.map((r) => r.row))))),
    planCard(), defenseTest, gvgSettings(g, send));
}
// Export du plan de défense : messages Discord à copier, fichiers .md / .csv
function planCard() {
  const out = el("div", {});
  const copy = async (text, btn) => {
    try { await navigator.clipboard.writeText(text); }
    catch { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
    const old = btn.textContent; btn.textContent = "Copié ✔"; setTimeout(() => { btn.textContent = old; }, 1500);
  };
  const show = async () => {
    const plan = await json("GET", "/gvg/plan");
    out.replaceChildren(...plan.messages.map((m, i) => {
      const btn = el("button", { class: "ghost", style: "padding:3px 10px;font-size:12px" }, plan.messages.length > 1 ? `Copier le message ${i + 1}/${plan.messages.length}` : "Copier le message");
      btn.addEventListener("click", () => copy(m, btn));
      return el("div", { class: "simbox" }, btn, el("div", { class: "log" }, m));
    }));
    return plan;
  };
  const save = async (fmt) => {
    if (window.pywebview?.api?.save_defense_plan) {
      const path = await window.pywebview.api.save_defense_plan(fmt);
      if (path) alert("Plan enregistré :\n" + path);
      return;
    }
    const plan = await json("GET", "/gvg/plan");
    const blob = new Blob([fmt === "csv" ? plan.csv : plan.text], { type: fmt === "csv" ? "text/csv" : "text/markdown" });
    const url = URL.createObjectURL(blob);
    el("a", { href: url, download: "plan-defense-gvg." + fmt }).click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };
  // Envoi direct dans le salon de la guilde (webhook Discord enregistré sur cet ordinateur)
  const hook = el("div", { class: "simbox" });
  const msg = el("p", { class: "note", role: "status" });
  const say = (text, ok) => { msg.textContent = text; msg.style.color = `var(${ok ? "--ok" : "--danger"})`; };
  const drawHook = async () => {
    const st = await json("GET", "/gvg/webhook");
    const url = el("input", { type: "password", placeholder: "https://discord.com/api/webhooks/…", autocomplete: "off", style: "width:100%", "aria-label": "Adresse du webhook" });
    const saveHook = el("button", { class: "ghost", onclick: async () => {
      try { await json("PUT", "/gvg/webhook", { url: url.value }); say(url.value ? "Webhook enregistré." : "Webhook retiré.", true); drawHook(); }
      catch (e) { say(e.message, false); }
    } }, "Enregistrer le webhook");
    const sendBtn = el("button", { onclick: async () => {
      if (!confirm("Publier le plan de défense dans le salon Discord ?")) return;
      sendBtn.disabled = true; say("Envoi en cours…", true);
      try { const r = await json("POST", "/gvg/plan/send"); say(`Plan publié sur Discord (${r.sent} message${r.sent > 1 ? "s" : ""}).`, true); }
      catch (e) { say(e.message, false); }
      finally { sendBtn.disabled = false; }
    } }, "Envoyer sur Discord");
    if (!st.configured) sendBtn.disabled = true;
    const auto = el("input", { type: "checkbox" });
    auto.checked = st.auto; auto.disabled = !st.configured;
    auto.addEventListener("change", async () => {
      try { await json("PUT", "/gvg/webhook", { auto: auto.checked }); say(auto.checked ? "Mise à jour automatique activée." : "Mise à jour automatique désactivée.", true); drawHook(); }
      catch (e) { say(e.message, false); }
    });
    const state = el("div", { class: "note" }, st.last_error ? `⚠ Dernière publication automatique : ${st.last_error}`
      : st.last_sent ? `Dernière publication : ${st.last_sent}` : "Aucune publication pour l'instant.");
    if (st.last_error) state.style.color = "var(--danger)";
    hook.replaceChildren(
      el("div", { class: "note" }, st.configured ? `Salon configuré : ${st.hint}. Collez une autre adresse pour la remplacer, ou enregistrez un champ vide pour la retirer.`
        : "Webhook Discord du salon de la guilde : Paramètres du salon → Intégrations → Webhooks → Nouveau webhook → Copier l'URL."),
      el("div", { class: "filters", style: "width:100%" }, url, saveHook, sendBtn),
      el("label", { class: "autosend" }, auto, " Mettre à jour automatiquement le plan publié à chaque modification (défenses, tours, membres) — le message Discord est modifié, sans nouveau message, 20 s après la dernière modification"),
      state, msg);
  };
  drawHook().catch((e) => say(e.message, false));
  return el("div", { class: "card" }, el("h3", {}, "Exporter le plan de défense"),
    el("p", { class: "note" }, "À partager avec la guilde : texte prêt pour Discord (découpé en messages de 2 000 caractères au plus), ou fichier .md / tableur .csv."),
    el("div", { class: "filters" },
      el("button", { onclick: show }, "Préparer le texte Discord"),
      el("button", { class: "ghost", onclick: () => save("md") }, "Enregistrer (.md)"),
      el("button", { class: "ghost", onclick: () => save("csv") }, "Enregistrer pour tableur (.csv)")),
    el("h3", { style: "margin-top:14px" }, "Publier sur Discord"), hook, out);
}
function gvgSettings(g, send) {
  const per = el("input", { type: "number", min: "1", max: "10", value: g.settings.attacks_per_member });
  const towers = el("input", { value: g.settings.towers.join(", "), maxlength: "400" });
  per.addEventListener("change", () => send("PATCH", "/settings", { attacks_per_member: per.value }));
  towers.addEventListener("change", () => send("PATCH", "/settings", { towers: towers.value.split(",") }, () => gvgPage()));
  return el("div", { class: "card" }, el("h3", {}, "Réglages"), el("div", { class: "grid2" },
    field("Attaques par membre et par guerre", per), field("Tours proposées (séparées par des virgules)", towers)));
}
function gvgWars(page, g, send) {
  const opponent = el("input", { placeholder: "Guilde adverse", maxlength: "40" });
  const day = el("input", { type: "date", value: new Date().toISOString().slice(0, 10) });
  const create = el("button", { onclick: () => opponent.value.trim() && send("POST", "/wars", { opponent: opponent.value, date: day.value }, () => { gvgWar = null; gvgPage("wars"); }) }, "Nouvelle guerre");
  page.append(el("div", { class: "card" }, el("h3", {}, "Nouvelle guerre"), el("div", { class: "filters" }, opponent, day, create)));

    el("div", { class: "stat-tiles" },
      el("div", { class: "tile" }, el("b", {}, fmtN(total)), el("span", {}, "attaques jouées")),
      el("div", { class: "tile" }, el("b", {}, total ? `${Math.round(100 * war.wins / total)} %` : "—"), el("span", {}, "de victoires")),
      el("div", { class: "tile" }, el("b", {}, fmtN(Object.values(war.remaining).reduce((a, b) => a + b, 0))), el("span", {}, "attaques restantes"))));
  // formulaire d'attaque
  const member = el("select", { "aria-label": "Attaquant" }, ...g.members.map((m) => el("option", { value: m.id }, `${m.player} (${war.remaining[m.id] ?? 0} restante(s))`)));
  const teamBox = el("div", { class: "team" });
  let team = [];
  const fillTeam = () => { const m = g.members.find((x) => x.id === member.value); team = [0, 1, 2].map((i) => heroSelect(m.heroes, "", `Héros ${i + 1}`)); teamBox.replaceChildren(...team); };
  member.addEventListener("change", fillTeam); fillTeam();
  const names = el("datalist", { id: "gvg-heroes" }, ...g.hero_names.map((n) => el("option", { value: n })));
  const enemy = [0, 1, 2].map((i) => el("input", { list: "gvg-heroes", placeholder: `Héros ennemi ${i + 1}`, maxlength: "40" }));
  const enemyPlayer = el("input", { placeholder: "Joueur adverse", maxlength: "40" });
  const tower = el("input", { list: "gvg-towers", placeholder: "Tour", maxlength: "40" });
  const result = el("select", { "aria-label": "Résultat" }, el("option", { value: "win" }, "Victoire"), el("option", { value: "loss" }, "Défaite"));
  const note = el("input", { placeholder: "Note (facultative)", maxlength: "200" });
  const add = el("button", { onclick: () => send("POST", `/wars/${war.id}/attacks`, {
    member: member.value, team: team.map((s) => s.value).filter(Boolean), enemy_team: enemy.map((i) => i.value),
    enemy_player: enemyPlayer.value, tower: tower.value, result: result.value, note: note.value }, () => gvgPage("wars")) }, "Enregistrer l'attaque");
  const test = simBox("Tester cette attaque dans le simulateur", () => ({
    a: asRefs(member.value, team.map((s) => s.value)), b: asEnemy(enemy.map((i) => i.value)), labels: ["Attaque", "Défense"] }));
  page.append(el("div", { class: "card" }, el("h3", {}, "Ajouter une attaque"), names,
    el("datalist", { id: "gvg-towers" }, ...g.settings.towers.map((t) => el("option", { value: t }))),
    el("div", { class: "wide" }, field("Attaquant", member), field("Équipe utilisée", teamBox),
      field("Défense ennemie", el("div", { class: "team" }, ...enemy)), field("Joueur et tour adverses", el("div", { class: "team" }, enemyPlayer, tower, el("span"))),
      field("Résultat", result), field("Note", note)),
    el("div", { style: "margin-top:12px" }, add), test));

    el("td", {}, a.player), el("td", {}, a.team.join(", ")),
    el("td", {}, (a.enemy_team.join(", ") || "—") + (a.enemy_player || a.tower ? ` (${[a.enemy_player, a.tower].filter(Boolean).join(" · ")})` : "")),
    el("td", { style: `color:var(${a.result === "win" ? "--ok" : "--danger"});font-weight:700` }, a.result === "win" ? "Victoire" : "Défaite"),
    el("td", { class: "note" }, a.note || ""),
    el("td", {}, el("button", { class: "danger", style: "padding:3px 10px;font-size:12px", onclick: () => send("DELETE", `/wars/${war.id}/attacks/${a.id}`, null, () => gvgPage("wars")) }, "×"))));
  page.append(el("div", { class: "card" }, el("h3", {}, `Attaques contre ${war.opponent}`),
    war.attacks.length ? el("div", { style: "overflow:auto" }, el("table", { class: "members" },
      el("thead", {}, el("tr", {}, ...["Attaquant", "Équipe", "Défense ennemie", "Résultat", "Note", ""].map((t) => el("th", {}, t)))), el("tbody", {}, ...rows)))
      : el("p", { class: "note" }, "Aucune attaque enregistrée.")),
    el("div", { class: "card" }, el("h3", {}, "Attaques restantes par membre"),
      el("div", { class: "chips" }, ...g.members.map((m) => el("span", { class: "chip", style: `padding-left:10px;${war.remaining[m.id] ? "" : "opacity:.55"}` },
        `${m.player} : ${war.remaining[m.id]}/${g.settings.attacks_per_member}`)))));
}
function counterTest(g, c) {
  const member = el("select", { "aria-label": "Membre" }, ...g.members.map((m) => el("option", { value: m.id }, m.player)));
  const box = el("div", { class: "team" });
  let picks = [];
  const fill = () => { const m = g.members.find((x) => x.id === member.value); picks = [0, 1, 2].map((i) => heroSelect(m.heroes, "", `Héros ${i + 1}`)); box.replaceChildren(...picks); };
  member.addEventListener("change", fill); fill();
  return el("div", { class: "simbox" }, el("div", { class: "note" }, "Tester une équipe contre cette défense :"), member, box,
    simBox("Simuler", () => ({ a: asRefs(member.value, picks.map((s) => s.value)), b: asEnemy(c.enemy_team), labels: ["Attaque", "Défense"] })));
}
function gvgCounters(page, g) {
  if (!g.counters.length) { page.append(el("div", { class: "empty" }, "Les contres apparaissent ici dès que des attaques avec une défense ennemie renseignée sont enregistrées.")); return; }
  const q = el("input", { type: "search", placeholder: "Rechercher un héros ennemi…", "aria-label": "Recherche" });
  const list = el("div", { class: "grid2" });
  const draw = () => {
    const f = q.value.trim().toLowerCase();
    list.replaceChildren(...g.counters.filter((c) => !f || c.enemy_team.some((h) => h.toLowerCase().includes(f))).map((c) => el("div", { class: "card" },
      el("h3", {}, c.enemy_team.join(" · ")),
      el("p", { class: "note" }, `${c.wins} victoire(s), ${c.losses} défaite(s) contre cette défense`),
      el("table", { class: "res" }, el("thead", {}, el("tr", {}, el("th", {}, "Équipe"), el("th", {}, "V"), el("th", {}, "D"))),
        el("tbody", {}, ...c.teams.map((t) => el("tr", {}, el("td", {}, t.team.join(", ")),
          el("td", { class: "exp" }, t.wins), el("td", { style: "color:var(--danger)" }, t.losses))))),
      counterTest(g, c))));
  };
  q.addEventListener("input", draw);
  page.append(el("div", { class: "card" }, q), list);
  draw();
}

$("#new").onclick = () => { $("#dlg-name").value = ""; $("#dlg").showModal(); };

  e.preventDefault();
  const player = $("#dlg-name").value.trim();

  $("#dlg").close();
  try { const r = await json("POST", "/profiles", { player }); tab = "vitrine"; await refresh(r.id); }

  catch (err) { alert(err.message); }

const start = new URLSearchParams(location.hash.slice(1)).get("p");
refresh(start || undefined).then(() => { if (!start) render(); });
