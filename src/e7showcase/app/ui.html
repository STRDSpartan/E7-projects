<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zealot</title>
<link rel="icon" href="/media/emblem.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23141925' stroke='%23e8c26a' stroke-width='2'/%3E%3Ctext x='16' y='21' font-size='12' font-family='sans-serif' font-weight='700' fill='%23e8c26a' text-anchor='middle'%3EE7%3C/text%3E%3C/svg%3E">
<style>
:root { --bg:#060818; --panel:#0e1230; --panel-2:#171c3e; --line:#2a2f5c; --text:#eef0ff; --muted:#9ca2cc;
  --gold:#b9a0ff; --accent:#7fb4ff; --sakura:#ff9fd4; --lantern:#f4c980; --danger:#e26060; --ok:#7fe0a0; color-scheme: dark; }
* { box-sizing: border-box; }
body:focus { outline:none; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif;
  display:grid; grid-template-columns: 260px minmax(0,1fr); height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.brand { padding:16px; font-weight:800; letter-spacing:.06em; color:var(--gold); font-size:17px; }
.brand small { display:block; color:var(--muted); font-weight:400; letter-spacing:0; font-size:12px; }
.list { flex:1; overflow:auto; padding:0 8px; }
.list h3 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:14px 8px 6px; letter-spacing:.08em; }
.item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); padding:8px 10px;
  border-radius:8px; cursor:pointer; }
.item:hover { background:var(--panel-2); } .item.active { background:#262a5a; }
.item small { display:block; color:var(--muted); }
.side-actions { padding:12px; display:grid; gap:8px; border-top:1px solid var(--line); }
button { font:inherit; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--gold); color:#120c2e; font-weight:600; }
button.ghost { background:var(--panel-2); color:var(--text); font-weight:500; }
button.danger { background:transparent; color:var(--danger); border:1px solid #5a2a2a; }
button:disabled { opacity:.5; cursor:default; }
main { display:flex; flex-direction:column; min-height:0; }
.bar { display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar h1 { margin:0; font-size:20px; flex:1; min-width:0; }
.bar h1 input { background:transparent; border:1px solid transparent; color:var(--text); font:inherit; font-weight:700; width:100%; padding:2px 6px; border-radius:6px; }
.bar h1 input:hover, .bar h1 input:focus { border-color:var(--line); outline:none; }
.badge { font-size:12px; color:var(--accent); border:1px solid #3a3f80; border-radius:999px; padding:2px 10px; }
.drop { margin:12px 16px 0; border:2px dashed var(--line); border-radius:12px; padding:14px; text-align:center; color:var(--muted); cursor:pointer; }
.drop.over { border-color:var(--gold); color:var(--text); background:#1a1636; }
.report { margin:8px 16px 0; font-size:13px; }
.report .transient { transition: opacity .6s ease; } .report .fading { opacity: 0; }
.report .ok { color:var(--ok); } .report .warn { color:var(--gold); } .report .err { color:var(--danger); }
.progress { margin:10px 16px 0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.progress .head { display:flex; justify-content:space-between; gap:12px; font-size:13px; margin-bottom:8px; }
.progress .head b { color:var(--gold); font-variant-numeric:tabular-nums; }
.progress .msg { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track { height:12px; background:#0a0d26; border-radius:999px; overflow:hidden; border:1px solid #232a3b; }
.fill { height:100%; width:0; border-radius:999px; transition:width .45s ease;
  background:linear-gradient(90deg, #7d68f0, var(--gold) 50%, #f6f0ff);
  background-size:200% 100%; position:relative; animation:shine 2.2s linear infinite; }
.fill::after { content:""; position:absolute; inset:0; border-radius:inherit;
  background:repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px);
  background-size:28px 28px; animation:stripes .8s linear infinite; }
.progress.done .fill { animation:none; background:var(--ok); } .progress.done .fill::after { display:none; }
.progress .heroes { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.progress .heroes span { font-size:12px; background:#1f2a1f; color:var(--ok); border-radius:999px; padding:2px 10px; animation:pop .35s ease; }
@keyframes stripes { to { background-position:28px 0; } }
@keyframes shine { to { background-position:-200% 0; } }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .fill, .fill::after, .progress .heroes span { animation:none; } }
iframe { flex:1; border:0; width:100%; margin-top:10px; background:var(--bg); }
.empty { margin:auto; text-align:center; color:var(--muted); max-width:520px; padding:24px; }
.empty h2 { color:var(--text); }
.sim { padding:16px; overflow:auto; display:grid; gap:14px; align-content:start; }
.tabs { display:flex; gap:6px; } .tabs button { background:var(--panel-2); color:var(--text); font-weight:500; }
.tabs button[aria-pressed="true"] { background:var(--gold); color:#120c2e; font-weight:700; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:15px; color:var(--gold); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
.field { display:grid; gap:4px; font-size:13px; color:var(--muted); }
.field select, .field input { width:100%; min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; }
.checks { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; }
table.res { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
table.res th, table.res td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:right; }
table.res th:first-child, table.res td:first-child { text-align:left; }
table.res td.crit { color:var(--gold); font-weight:700; } table.res td.exp { color:var(--ok); font-weight:700; }
.note { font-size:12px; color:var(--muted); }
.wins { display:flex; height:28px; border-radius:8px; overflow:hidden; font-weight:700; font-size:13px; }
.wins div { display:grid; place-items:center; min-width:0; overflow:hidden; white-space:nowrap; }
.log { font:12.5px/1.6 ui-monospace, Consolas, monospace; background:#0d111a; border:1px solid var(--line); border-radius:8px;
  padding:10px; max-height:360px; overflow:auto; white-space:pre-wrap; }
.empty ol { text-align:left; }
dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:18px; }
dialog input { width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; margin:10px 0; font:inherit; }
.topnav { display:flex; gap:4px; padding:10px 16px 0; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
.topnav button { background:transparent; color:var(--muted); font-weight:600; border-radius:8px 8px 0 0; padding:9px 16px; border-bottom:2px solid transparent; }
.topnav button:hover { color:var(--text); background:var(--panel-2); }
.topnav button[aria-selected="true"] { color:var(--gold); border-bottom-color:var(--gold); background:var(--bg); }
#content { flex:1; display:flex; flex-direction:column; min-height:0; overflow:auto; }
.page { padding:16px; display:grid; gap:14px; align-content:start; }
.filters { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; }
.filters select, .filters input, .bar h1 input[aria-label="Nom de la guilde"] { min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:2px 10px 2px 4px; }
.chip img { width:20px; height:20px; }
.gear-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
.gear { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; gap:6px; }
.gear.free { border-color:#3c5a3c; }
.gear .top { display:flex; gap:10px; align-items:center; }
.gear .icon { width:56px; height:56px; border-radius:10px; background:var(--panel-2); display:grid; place-items:center; flex:none; overflow:hidden; position:relative; }
.gear .icon img.main { width:100%; height:100%; object-fit:cover; }
.gear .icon img.shield { position:absolute; right:-2px; bottom:-2px; width:24px; height:24px; }
.gear .title { font-weight:700; } .gear .title b { color:var(--gold); }
.gear .owner { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; } .gear.free .owner { color:var(--ok); }
.gear ul { margin:0; padding:0; list-style:none; font-size:13px; display:grid; gap:2px; font-variant-numeric:tabular-nums; }
.gear li { display:flex; justify-content:space-between; gap:8px; } .gear li.main { color:var(--gold); font-weight:600; }
.gear .del { justify-self:end; padding:3px 10px; font-size:12px; }
.rank-epic { color:#e26060; } .rank-heroic { color:#c58cff; } .rank-rare { color:#7fb4ff; } .rank-good { color:#7fe0a0; }
table.members { width:100%; border-collapse:collapse; }
table.members th, table.members td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
table.members td.num { text-align:right; font-variant-numeric:tabular-nums; }
table.members td .acts { display:flex; gap:6px; flex-wrap:wrap; }
table.members td .acts button { padding:4px 10px; font-size:12px; }
.team { display:grid; grid-template-columns:repeat(3, minmax(90px, 1fr)); gap:6px; }
.team select, .team input, .page .card > input, .grid2 .field input { min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
table.gvg td { min-width:120px; }
table.gvg input { width:100%; min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
.note[role="status"]:empty { display:none; }
.wide { display:grid; grid-template-columns:repeat(auto-fit, minmax(380px, 1fr)); gap:12px; }
.page .card > input[type="search"] { width:100%; }
.simbox > select { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; }
.autosend { display:flex; gap:8px; align-items:flex-start; font-size:13px; }
.autosend input { margin-top:3px; flex:none; }
.simbox { display:grid; gap:8px; margin-top:10px; justify-items:start; } .simbox > div { width:100%; }
.simbox .wins { margin-top:4px; }
.stat-tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
.tile b { display:block; font-size:22px; color:var(--gold); font-variant-numeric:tabular-nums; } .tile span { font-size:12px; color:var(--muted); }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); } aside { max-height: 40vh; } }

/* ===== Esthétique et animations (voir docs/UI_MOTION.md) ===== */
:root { --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --glow:rgba(185,160,255,.35); --glass:rgba(10,12,34,.55); --t-fast:.18s; --t-med:.38s; }
body { background:
  radial-gradient(1200px 700px at 85% -10%, rgba(127,180,255,.12), transparent 60%),
  radial-gradient(800px 500px at 50% 120%, rgba(255,159,212,.08), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(185,160,255,.09), transparent 60%),
  var(--bg); background-attachment:fixed; }
#fx { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:0; }
aside, main { position:relative; z-index:1; }
aside { background:var(--glass); backdrop-filter:blur(14px) saturate(1.2); }
.topnav { background:rgba(12,14,38,.6); backdrop-filter:blur(12px); position:relative; }
.brand { background:linear-gradient(100deg, #7d68f0 0%, var(--gold) 30%, #ffd9ef 45%, var(--gold) 60%, #7d68f0 100%);
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:brand 7s ease-in-out infinite; }
.brand small { -webkit-text-fill-color:var(--muted); }
@keyframes brand { 0%,100% { background-position:100% 0; } 50% { background-position:0 0; } }
.topnav .ink { position:absolute; bottom:-1px; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent);
  box-shadow:0 0 12px var(--glow); transition:left var(--t-med) var(--ease-out), width var(--t-med) var(--ease-out); pointer-events:none; }
.topnav button { transition:color var(--t-fast), background var(--t-fast), transform var(--t-fast); }
.topnav button[aria-selected="true"] { border-bottom-color:transparent; text-shadow:0 0 14px var(--glow); }
.tabs button[aria-pressed="true"] { background:linear-gradient(180deg, #e2d6ff, var(--gold) 55%, #7d68f0); box-shadow:0 2px 12px rgba(185,160,255,.25); }
.topnav button:active { transform:translateY(1px); }
button { position:relative; overflow:hidden; transition:transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast), background var(--t-fast), filter var(--t-fast); }
button:not(.ghost):not(.danger):not(.item):not(:disabled):not(.topnav button):not(.tabs button) { background:linear-gradient(180deg, #e2d6ff, var(--gold) 55%, #7d68f0); box-shadow:0 2px 10px rgba(185,160,255,.18); }
button:not(:disabled):hover { transform:translateY(-1px); filter:brightness(1.08); }
button:not(.ghost):not(.danger):not(.item):not(:disabled):not(.topnav button):not(.tabs button):hover { box-shadow:0 6px 18px rgba(185,160,255,.32); }
button:not(:disabled):active { transform:translateY(0) scale(.98); }
button.ghost:hover { background:#232b3d; } button.danger:hover { background:rgba(226,96,96,.12); }
.ripple { position:absolute; border-radius:50%; transform:scale(0); background:rgba(255,255,255,.35); animation:ripple .6s var(--ease-out); pointer-events:none; }
@keyframes ripple { to { transform:scale(4); opacity:0; } }
.item { transition:background var(--t-fast), transform var(--t-fast) var(--ease-out); position:relative; }
.item:hover { transform:translateX(3px); }
.item.active { background:linear-gradient(90deg, rgba(185,160,255,.16), rgba(38,42,90,.6)); box-shadow:inset 3px 0 0 var(--gold); }
.card, .tile, .gear, .progress { background:linear-gradient(180deg, rgba(27,33,48,.92), rgba(14,16,42,.92));
  transition:transform var(--t-med) var(--ease-out), box-shadow var(--t-med), border-color var(--t-med); position:relative; }
.card:hover, .gear:hover, .tile:hover { border-color:#4a3f8a; box-shadow:0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(185,160,255,.08); }
.gear:hover, .tile:hover { transform:translateY(-3px); }
.gear::before, .tile::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0;
  background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%), rgba(185,160,255,.12), transparent 40%); transition:opacity var(--t-med); }
.gear:hover::before, .tile:hover::before { opacity:1; }
.gear .icon { transition:transform var(--t-med) var(--ease-spring); } .gear:hover .icon { transform:scale(1.06) rotate(-2deg); }
.gear.rank-border-epic { box-shadow:inset 0 0 0 1px rgba(226,96,96,.25); }
.tile b { text-shadow:0 0 18px var(--glow); }
.card h3 { display:flex; align-items:center; gap:8px; }
.card h3::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); flex:none; }
input, select { transition:border-color var(--t-fast), box-shadow var(--t-fast); }
input:focus, select:focus { outline:none; border-color:var(--gold) !important; box-shadow:0 0 0 3px rgba(185,160,255,.18); }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
table.members tbody tr, table.res tbody tr { transition:background var(--t-fast); }
table.members tbody tr:hover, table.res tbody tr:hover { background:rgba(185,160,255,.05); }
.drop { transition:border-color var(--t-med), background var(--t-med), transform var(--t-med) var(--ease-out); }
.drop:hover { border-color:#5a4fa0; } .drop.over { transform:scale(1.01); box-shadow:0 0 0 4px rgba(185,160,255,.12), inset 0 0 40px rgba(185,160,255,.08); }
.wins div { animation:grow .9s var(--ease-out) both; transform-origin:left; }
@keyframes grow { from { transform:scaleX(0); } }
dialog[open] { animation:dlg .32s var(--ease-spring); box-shadow:0 30px 80px rgba(0,0,0,.6); }
dialog::backdrop { background:rgba(5,7,12,.6); backdrop-filter:blur(4px); animation:fade .25s ease; }
@keyframes dlg { from { opacity:0; transform:translateY(16px) scale(.96); } }
@keyframes fade { from { opacity:0; } }
/* transitions entre onglets et apparitions */
#content.leave { animation:leave .16s ease-in forwards; }
#content.enter-r { animation:enterR var(--t-med) var(--ease-out); } #content.enter-l { animation:enterL var(--t-med) var(--ease-out); }
#content.enter { animation:enterUp var(--t-med) var(--ease-out); }
@keyframes leave { to { opacity:0; transform:translateY(4px); filter:blur(2px); } }
@keyframes enterR { from { opacity:0; transform:translateX(28px); } }
@keyframes enterL { from { opacity:0; transform:translateX(-28px); } }
@keyframes enterUp { from { opacity:0; transform:translateY(10px); } }
.reveal { animation:reveal .55s var(--ease-out) both; animation-delay:calc(var(--i, 0) * 45ms); }
@keyframes reveal { from { opacity:0; transform:translateY(14px) scale(.985); } }
.list .item { animation:reveal .45s var(--ease-out) both; animation-delay:calc(var(--i, 0) * 30ms); }
.empty h2 { animation:float 5s ease-in-out infinite; }
@keyframes float { 50% { transform:translateY(-4px); } }
.fx-toggle { margin:0 12px 12px; font-size:12px; }
::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:#2a3245; border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover { background:#4a3f8a; background-clip:padding-box; border:2px solid transparent; }

/* --- v0.39 : icônes d'onglets, accueil, notifications, rangs, chargement --- */
.tab-ico { width:16px; height:16px; vertical-align:-3px; margin-right:7px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform var(--t-med) var(--ease-spring); }
.topnav button:hover .tab-ico { transform:translateY(-1px) scale(1.12); }
.topnav button[aria-selected="true"] .tab-ico { filter:drop-shadow(0 0 6px var(--glow)); }
.welcome { max-width:640px; }
.welcome h2 { font-size:28px; margin:8px 0; background:linear-gradient(90deg, var(--text), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.emblem { width:150px; height:150px; margin:0 auto; filter:drop-shadow(0 0 24px rgba(185,160,255,.25)); }
.emblem svg { width:100%; height:100%; overflow:visible; }
.emblem { width:220px; height:auto; margin-bottom:14px; animation:breathe 5s ease-in-out infinite; } .emblem img { width:100%; display:block; }
.emblem .ring { transform-origin:100px 100px; } .emblem .r1 { animation:spin 40s linear infinite; } .emblem .r2 { animation:spin 26s linear infinite reverse; }
.emblem .core { animation:breathe 4s ease-in-out infinite; transform-origin:100px 100px; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes breathe { 50% { transform:scale(1.03); filter:drop-shadow(0 0 10px rgba(185,160,255,.5)); } }
ol.steps { list-style:none; padding:0; display:grid; gap:8px; counter-reset:st; margin:18px 0; }
ol.steps li { counter-increment:st; display:flex; gap:12px; align-items:flex-start; text-align:left; background:rgba(27,33,48,.7);
  border:1px solid var(--line); border-radius:12px; padding:10px 14px; animation:reveal .55s var(--ease-out) both; }
ol.steps li:nth-child(2) { animation-delay:.08s; } ol.steps li:nth-child(3) { animation-delay:.16s; } ol.steps li:nth-child(4) { animation-delay:.24s; }
ol.steps li::before { content:counter(st); flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:12px;
  color:#120c2e; background:linear-gradient(180deg, #e2d6ff, var(--gold)); box-shadow:0 0 12px var(--glow); }
#toasts { position:fixed; right:18px; bottom:18px; z-index:50; display:grid; gap:10px; width:min(380px, calc(100vw - 36px)); }
.toast { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; cursor:pointer; white-space:pre-wrap; font-size:13px;
  background:rgba(14,16,42,.92); backdrop-filter:blur(10px); border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.45);
  animation:toastIn .45s var(--ease-spring); position:relative; overflow:hidden; word-break:break-word; }
.toast .ico { flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:12px; color:#060818; background:var(--ok); }
.toast.warn .ico { background:var(--gold); } .toast.err .ico { background:var(--danger); }

  color:var(--ok); border:1px solid rgba(127,224,160,.4); border-radius:999px; padding:1px 7px; }

/* --- v0.40 : portraits de héros et tableaux GvG --- */

.hp-xs { width:22px; height:22px; border-radius:7px; } .hp-sm { width:34px; height:34px; border-radius:9px; }
.hp-md { width:48px; height:48px; } .hp-lg { width:64px; height:64px; border-radius:14px; }
.hp img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(1.08); transition:opacity .4s, transform .6s var(--ease-out); }

.hp-ini { font-weight:800; font-size:.8em; color:#cfd6e4; letter-spacing:.02em; transition:opacity .3s; }
.hp-sm .hp-ini { font-size:11px; } .hp-xs .hp-ini { font-size:9px; }

  background:linear-gradient(transparent, rgba(0,0,0,.75)); text-shadow:0 0 4px rgba(255,200,80,.8); }

.hp::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.28) 50%, transparent 60%); background-size:250% 100%; background-position:150% 0; }
.hp:hover { transform:translateY(-2px) scale(1.06); z-index:2; } .hp:hover::after { animation:sheen .8s ease; }
@keyframes sheen { to { background-position:-50% 0; } }
.hp[data-el="fire"] { --c1:#e2603f; --c2:#4a1d14; } .hp[data-el="ice"] { --c1:#7fb4ff; --c2:#12304a; }
.hp[data-el="earth"] { --c1:#6fcf5a; --c2:#1d3a17; } .hp[data-el="light"] { --c1:#ffd166; --c2:#4a3b12; }
.hp[data-el="dark"] { --c1:#b071ff; --c2:#2c1646; }
.hp[data-el]:hover { box-shadow:0 0 0 2px var(--c1), 0 0 18px var(--c1); }
.hp-empty { background:transparent; box-shadow:none; border:1.5px dashed #4a3f8a; }
.hp-empty:hover { transform:none; }
.hteam { display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap; }
.hchip { display:inline-flex; align-items:center; gap:8px; }
.hta-chips { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; } .hta-chips .hchip { padding:4px 10px; }
.page textarea { width:100%; box-sizing:border-box; font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin:6px 0; resize:vertical; }
.member-cell { display:flex; align-items:center; gap:10px; }
.avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; flex:none; font-weight:800; color:#120c2e;
  background:linear-gradient(135deg, #f6f0ff, var(--gold) 50%, #5546c9); box-shadow:0 0 0 2px rgba(185,160,255,.25); }
.tower-cell { display:flex; align-items:center; gap:6px; } .tower-cell input { flex:1; }
.tower-ico { filter:drop-shadow(0 0 6px rgba(185,160,255,.4)); }
.team-preview { margin-bottom:8px; min-height:48px; }
.team.compact select { font-size:12px; padding:4px; }
table.gvg tbody tr td, table.members tbody tr td { vertical-align:middle; }
table.gvg tbody tr { background:linear-gradient(90deg, rgba(185,160,255,.03), transparent 40%); }

.vs { display:flex; align-items:center; gap:8px; }
.vs-badge { font-size:10px; font-weight:900; font-style:italic; color:#120c2e; background:linear-gradient(135deg, #ffb0a0, var(--danger)); border-radius:6px; padding:2px 5px; }
.pill { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:3px 12px; }
.pill.win { color:#060818; background:linear-gradient(180deg, #a6f0c0, var(--ok)); box-shadow:0 0 12px rgba(127,224,160,.3); }
.pill.loss { color:#fff; background:linear-gradient(180deg, #ef8a8a, var(--danger)); box-shadow:0 0 12px rgba(226,96,96,.3); }
.remain-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
.remain { display:grid; gap:8px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:rgba(13,17,26,.5); }
.remain.done { opacity:.6; }
.pips { display:flex; gap:5px; } .pips span { flex:1; height:8px; border-radius:4px; background:linear-gradient(90deg, #e2d6ff, var(--gold)); box-shadow:0 0 8px var(--glow); }
.pips span.used { background:#262e40; box-shadow:none; }
.counter-head { display:flex; gap:14px; align-items:center; margin-bottom:10px; } .counter-head h3 { margin:0 0 4px; }
.ratio { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-bottom:12px; background:#262e40; }
.ratio .w { background:var(--ok); } .ratio .l { background:var(--danger); }

.counter-list { display:grid; gap:6px; }
.note.names { margin-top:4px; }
.counter-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; background:rgba(13,17,26,.5); border:1px solid var(--line); }
.counter-row.good { border-color:rgba(127,224,160,.35); } .counter-row.bad { border-color:rgba(226,96,96,.3); opacity:.85; } .counter-row.mixed { border-color:rgba(185,160,255,.3); }
.counter-row .score { font-variant-numeric:tabular-nums; font-size:13px; } .score .w { color:var(--ok); } .score .l { color:var(--danger); }

/* --- v0.41 : rejeu animé du combat --- */
.acts-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.replay { width:100%; display:grid; gap:10px; padding:14px; border-radius:14px; border:1px solid var(--line);
  background:radial-gradient(600px 220px at 50% 0%, rgba(185,160,255,.08), transparent 70%), rgba(6,8,24,.7); }
.arena { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center; }
.side { display:grid; gap:10px; } .side-label { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

.vs-mid { font-weight:900; font-style:italic; font-size:26px; color:var(--gold); text-shadow:0 0 18px var(--glow); animation:float 3s ease-in-out infinite; }
.fighter { position:relative; display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto auto; column-gap:12px; align-items:center;
  padding:8px 10px; border-radius:12px; border:1px solid var(--line); background:rgba(14,16,42,.8); transition:transform .3s var(--ease-out), box-shadow .3s, opacity .5s, filter .5s; }
.fighter .hp { grid-row:1 / 4; }
.side-1 .fighter { grid-template-columns:1fr auto; } .side-1 .fighter .hp { grid-column:2; } .side-1 .fname, .side-1 .hpnum { text-align:right; }

.fname { font-weight:700; font-size:13px; }
.hpbar { position:relative; height:10px; border-radius:5px; background:#1a0f12; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
.hpfill, .hplag, .hpshield { position:absolute; left:0; top:0; bottom:0; border-radius:5px; }
.side-1 .hpfill, .side-1 .hplag, .side-1 .hpshield { left:auto; right:0; }
.hpfill { background:linear-gradient(180deg, #8ff0a8, #3fb868); transition:width .35s var(--ease-out), background .3s; z-index:2; }

@keyframes lowpulse { 50% { filter:brightness(1.35); } }
.hplag { background:#e2d6ff; transition:width .9s ease .35s; z-index:1; }
.hpshield { background:repeating-linear-gradient(-45deg, rgba(200,220,255,.85) 0 4px, rgba(150,180,255,.6) 4px 8px); z-index:3; height:4px; top:auto; transition:width .35s; }
.hpnum { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.fighter.active { transform:scale(1.04); box-shadow:0 0 0 2px var(--gold), 0 0 24px var(--glow); z-index:2; }
.side-0 .fighter.active { transform:scale(1.03) translateX(-3px); } .side-1 .fighter.active { transform:scale(1.03) translateX(3px); }
.fighter.ko { opacity:.45; filter:grayscale(1); } .fighter.ko .fname::after { content:" ✝"; color:var(--danger); }
.fighter.shake { animation:shake .35s ease; }
@keyframes shake { 20% { translate:-4px 0; } 40% { translate:4px 0; } 60% { translate:-3px 0; } 80% { translate:2px 0; } }
.dmg { position:absolute; top:4px; font-weight:900; font-size:18px; pointer-events:none; z-index:5; animation:dmg 1.1s var(--ease-out) forwards;
  text-shadow:0 2px 0 rgba(0,0,0,.6), 0 0 12px currentColor; }
.dmg.hit { color:#ff6b5a; } .dmg.heal { color:#7fe0a0; }
@keyframes dmg { 0% { transform:translateY(6px) scale(.6); opacity:0; } 15% { transform:translateY(-6px) scale(1.25); opacity:1; } 100% { transform:translateY(-34px) scale(1); opacity:0; } }
.replay-log { min-height:64px; max-height:110px; overflow:auto; font:12.5px/1.6 ui-monospace, Consolas, monospace; color:#cfd6e4;
  background:#0d111a; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.replay-log div { animation:reveal .35s var(--ease-out) both; } .replay-log .sub { color:var(--muted); padding-left:14px; }
.replay-banner { justify-self:center; font-size:20px; font-weight:900; letter-spacing:.04em; padding:8px 26px; border-radius:999px;
  animation:dlg .5s var(--ease-spring); color:#120c2e; background:linear-gradient(180deg, #f6f0ff, var(--gold)); box-shadow:0 0 30px var(--glow); }
.replay-banner.t0 { background:linear-gradient(180deg, #bfe0ff, #7fb4ff); box-shadow:0 0 30px rgba(127,180,255,.45); }
.replay-banner.t1 { background:linear-gradient(180deg, #ffd0c8, #e26060); box-shadow:0 0 30px rgba(226,96,96,.45); }
@media (max-width: 760px) { .arena { grid-template-columns:1fr; } .vs-mid { text-align:center; } }

/* --- v0.45 : simulateur, liste des profils, cases à cocher --- */
.versus { display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:stretch; }
.versus-badge { align-self:center; font-weight:900; font-style:italic; font-size:30px; color:var(--gold); text-shadow:0 0 22px var(--glow);
  animation:float 3s ease-in-out infinite; }
.team-card.side-a { border-color:rgba(127,180,255,.35); background:linear-gradient(160deg, rgba(127,180,255,.10), rgba(14,16,42,.92) 45%); }
.team-card.side-b { border-color:rgba(226,96,96,.35); background:linear-gradient(200deg, rgba(226,96,96,.10), rgba(14,16,42,.92) 45%); }
.team-card.side-a h3 { color:#8fc8ff; } .team-card.side-a h3::before { background:#7fb4ff; box-shadow:0 0 10px #7fb4ff; }
.team-card.side-b h3 { color:#ff9b9b; } .team-card.side-b h3::before { background:var(--danger); box-shadow:0 0 10px var(--danger); }

.item { display:flex !important; align-items:center; gap:10px; }

  background:linear-gradient(135deg, hsl(var(--h) 60% 55%), hsl(calc(var(--h) + 40) 55% 35%)); box-shadow:0 0 0 2px rgba(255,255,255,.08);
  transition:transform var(--t-med) var(--ease-spring), box-shadow var(--t-med); }

.me-badge { color:var(--gold); margin-left:6px; font-size:12px; }
.ctx-menu { position:fixed; z-index:1000; min-width:240px; padding:6px; border-radius:12px; background:rgba(14,16,42,.98); border:1px solid rgba(185,160,255,.35); box-shadow:0 14px 40px rgba(0,0,0,.6); display:grid; gap:2px; animation:pop .14s ease-out; }
.ctx-menu button { text-align:left; background:none !important; color:var(--text, #e8eaf0) !important; box-shadow:none !important; padding:9px 12px; border-radius:8px; font-weight:600; }
.ctx-menu button:hover, .ctx-menu button:focus-visible { background:rgba(185,160,255,.14); transform:none; }
.ctx-back { position:fixed; inset:0; z-index:999; background:rgba(4,6,12,.6); display:grid; place-items:center; padding:16px; backdrop-filter:blur(3px); }
.ctx-dialog { width:min(560px, 100%); }
@keyframes pop { from { opacity:0; transform:scale(.96); } }
.pinfo { display:grid; min-width:0; } .pinfo b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
input[type="checkbox"], input[type="radio"] { accent-color:var(--gold); width:16px; height:16px; cursor:pointer; }

label:has(> input[type="checkbox"]) { cursor:pointer; transition:color var(--t-fast); } label:has(> input[type="checkbox"]:checked) { color:var(--text); }
select { cursor:pointer; }

/* --- v0.46 : verdict de fin de simulation --- */
.verdict { --c:#b9a0ff; --c2:#5546c9; position:relative; overflow:hidden; display:flex; align-items:center; gap:18px; width:100%;
  padding:16px 22px; border-radius:16px; border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
  background:linear-gradient(110deg, color-mix(in srgb, var(--c) 22%, #0d111a), #0d111a 70%);
  box-shadow:0 0 0 1px rgba(0,0,0,.3), 0 12px 40px rgba(0,0,0,.4), 0 0 40px color-mix(in srgb, var(--c) 25%, transparent);
  animation:vdIn .7s var(--ease-spring) both; margin-bottom:12px; }
.verdict.t0 { --c:#7fb4ff; --c2:#1e5f99; } .verdict.t1 { --c:#ff6b5a; --c2:#99302a; } .verdict.close { --c:#b9a0ff; --c2:#5546c9; }
.verdict::after { content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); transform:translateX(-120%);
  animation:vdSweep 1.4s ease .5s forwards; }
.vd-rays { position:absolute; left:-40px; top:50%; width:220px; height:220px; margin-top:-110px; pointer-events:none; opacity:.35;
  background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--c) 60%, transparent) 0 6deg, transparent 6deg 18deg);
  mask:radial-gradient(circle, #000 20%, transparent 70%); -webkit-mask:radial-gradient(circle, #000 20%, transparent 70%); animation:spin 18s linear infinite; }
.vd-icon { position:relative; font-size:44px; line-height:1; filter:drop-shadow(0 0 14px var(--c)); animation:vdPop .8s var(--ease-spring) .15s both; }
.vd-text { position:relative; display:grid; gap:2px; }
.vd-kicker { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--c); font-weight:800; }
.vd-team { font-size:28px; font-weight:900; letter-spacing:.01em; line-height:1.1;
  background:linear-gradient(180deg, #fff, color-mix(in srgb, var(--c) 70%, #fff)); -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:vdRise .6s var(--ease-out) .25s both; }
.vd-sub { color:var(--muted); font-size:13px; animation:vdRise .6s var(--ease-out) .4s both; }
.vd-pct { color:var(--c); font-size:16px; font-variant-numeric:tabular-nums; text-shadow:0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
@keyframes vdIn { from { opacity:0; transform:scale(.92) translateY(10px); } }
@keyframes vdPop { 0% { transform:scale(0) rotate(-30deg); } 70% { transform:scale(1.25) rotate(8deg); } }
@keyframes vdRise { from { opacity:0; transform:translateY(8px); } }
@keyframes vdSweep { to { transform:translateX(120%); } }

/* --- v0.47 : relevés GvG (capture de fin de combat) --- */
.scout-faces { border:1px dashed rgba(185,160,255,.5); border-radius:12px; padding:12px 14px; margin-bottom:10px; background:rgba(185,160,255,.05); }
.scout-teams { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.scout-team { border:1px solid var(--line); border-radius:12px; padding:10px; opacity:.7; transition:opacity var(--t-med), border-color var(--t-med), box-shadow var(--t-med); }
.scout-team.enemy { opacity:1; border-color:rgba(226,96,96,.5); box-shadow:0 0 20px rgba(226,96,96,.12); background:linear-gradient(180deg, rgba(226,96,96,.07), transparent 60%); }
.scout-team.ally { border-color:rgba(63,184,104,.5); }
.scout-pick { display:flex; align-items:center; gap:6px; font-weight:700; margin-bottom:8px; cursor:pointer; }
.scout-grid { display:grid; gap:8px; }
.scout-hero { border:1px solid var(--line); border-radius:10px; padding:8px; background:rgba(13,17,26,.5); display:grid; gap:6px; }
.scout-head { display:flex; gap:10px; align-items:center; } .scout-head > div { display:grid; gap:4px; flex:1; }
.scout-head input { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; font-weight:700; }
.scout-face { width:52px; height:52px; border-radius:50%; flex:none; box-shadow:0 0 0 2px rgba(185,160,255,.4); }
.scout-badge { justify-self:start; font-size:11px; border-radius:999px; padding:1px 8px; font-weight:700; }
.scout-badge.ok { color:#060818; background:var(--ok); } .scout-badge.check { color:#120c2e; background:var(--gold); animation:lowpulse 1.6s ease-in-out infinite; }
.chip-btn { padding:2px 10px; font-size:12px; border-radius:999px; }
.scout-stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:6px; }
.scout-stats label { display:grid; gap:2px; font-size:11px; color:var(--muted); }
.scout-stats input { background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:inherit; font-size:13px; min-width:0; }
.hidden-stats { opacity:.85; }

/* --- v0.50 : panorama de la guerre --- */
.wm-pano { position:relative; width:100%; aspect-ratio:2000/384; border-radius:16px; overflow:hidden; border:1px solid var(--line);
  background-size:cover; background-position:center; box-shadow:0 20px 50px rgba(0,0,0,.45); }
.wm-tint { position:absolute; inset:0; pointer-events:none;

<script>
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);
let profiles = [], current = null, tab = "vitrine";

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: { "X-E7-Token": TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = "Erreur " + res.status;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res;
}
const json = async (m, p, b) => (await api(m, p, b)).json();
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v);
  for (const c of kids) n.append(c);
  return n;
};
const toB64 = (file) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(file); });

async function refresh(select) {
  profiles = await json("GET", "/profiles");
  const list = $("#list"); list.replaceChildren();
  const mine = profiles.filter((p) => !p.received), recv = profiles.filter((p) => p.received);
  for (const [title, group] of [["Mes profils", mine], ["Vitrines reçues", recv]]) {
    if (!group.length) continue;
    list.append(el("h3", {}, title));
    for (const p of group) {
      const hue = [...p.player].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);  // couleur stable par joueur
      const item = el("button", { class: "item" + (p.id === (select || current) ? " active" : "") + (p.me ? " me" : ""), "data-id": p.id, onclick: () => selectProfile(p.id) },
        p.avatar ? el("img", { class: "pavatar pframe", src: p.avatar, alt: "", "aria-hidden": "true" })
          : el("span", { class: "pavatar" + (p.received ? " recv" : ""), style: `--h:${hue}`, "aria-hidden": "true" }, p.player.slice(0, 1).toUpperCase()),
        el("span", { class: "pinfo" }, el("b", {}, p.player, p.me ? el("span", { class: "me-badge", title: "Mon profil de joueur" }, "★") : ""),
          el("small", {}, [p.guild, p.rank ? `Rang ${p.rank}` : "", `${p.heroes} héros`].filter(Boolean).join(" · "))));
      if (!p.received) item.addEventListener("contextmenu", (e) => { e.preventDefault(); profileMenu(p, e.clientX, e.clientY); });
      list.append(item);
    }
  }
  if (select) { current = select; render(); } else if (!current && tab === "vitrine") welcome();
}

// Clic droit sur un profil : « mon profil » et mise à jour depuis la fiche de profil du jeu
function profileMenu(p, x, y) {
  document.querySelector(".ctx-menu")?.remove();
  const close = () => { menu.remove(); document.removeEventListener("pointerdown", outside, true); };
  const outside = (e) => { if (!menu.contains(e.target)) close(); };
  const menu = el("div", { class: "ctx-menu", role: "menu" },
    el("button", { role: "menuitem", onclick: async () => { close(); await json("PUT", `/profiles/${p.id}/me`); toast(`${p.player} est votre profil de joueur`); refresh(); } },
      p.me ? "★ Déjà mon profil de joueur" : "★ Définir comme mon profil de joueur"),
    el("button", { role: "menuitem", onclick: () => { close(); profileCardDialog(p); } }, "⟳ Mettre à jour le profil"));
  document.body.append(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  menu.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  setTimeout(() => document.addEventListener("pointerdown", outside, true));
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  menu.querySelector("button").focus();
}
function profileCardDialog(p) {
  const back = el("div", { class: "ctx-back" });
  const close = () => back.remove();
  back.addEventListener("pointerdown", (e) => { if (e.target === back) close(); });
  back.append(el("div", { class: "card ctx-dialog", role: "dialog", "aria-label": "Mettre à jour le profil" },
    el("h3", {}, `Mettre à jour ${p.player}`),
    el("p", { class: "note" }, "Capture de la fiche de profil du jeu (pseudo, serveur, guilde, rang et cadre de profil) : l'application lit ces informations et utilise le cadre de profil comme image du joueur. La capture n'est pas conservée."),
    captureZone("Fiche de profil — glissez-la ou cliquez", `/profiles/${p.id}/card`, () => { close(); toast("Profil mis à jour"); refresh(p.id === current ? current : undefined); }),
    el("button", { class: "ghost", style: "margin-top:8px", onclick: close }, "Fermer")));
  document.body.append(back);
  back.querySelector(".drop").focus();
}
function selectProfile(id) {
  current = id;
  if (tab !== "armory") tab = "vitrine";
  render();
}
// Notifications (toasts) : remplacent les alert(), sans bloquer la fenêtre
function toast(text, kind = "ok") {
  let box = $("#toasts");
  if (!box) { box = el("div", { id: "toasts", role: "status", "aria-live": "polite" }); document.body.append(box); }
  const node = el("div", { class: "toast " + kind }, el("span", { class: "ico" }, kind === "err" ? "!" : "✓"), el("div", {}, String(text)));
  const close = () => { node.classList.add("out"); setTimeout(() => node.remove(), 300); };
  node.addEventListener("click", close);
  box.append(node);
  setTimeout(close, kind === "err" ? 9000 : Math.min(12000, 4000 + String(text).length * 30));
}

  if (p.received) name.setAttribute("readonly", "");

  const bar = el("div", { class: "bar" }, el("h1", {}, name),
    p.received ? el("span", { class: "badge" }, "Vitrine reçue") : "",
    p.received ? "" : el("button", { title: "Publie la vitrine (fichier .e7v, cadre de profil et meilleurs héros) sur le salon Discord de la guilde", onclick: async (e) => {
      const b = e.currentTarget; b.disabled = true; const t = b.textContent; b.textContent = "Publication…";
      try { await json("POST", `/profiles/${id}/publish`); toast("Vitrine publiée sur Discord : vos coéquipiers n'ont qu'à ouvrir le fichier .e7v."); }
      catch (err) { toast(err.message, "err"); }

    el("button", { onclick: () => exportVitrine(id, p.player) }, "Exporter la vitrine"),

    el("button", { class: "danger", onclick: () => removeProfile(id, p.player) }, "Supprimer"));

// Coller une capture (Ctrl+V) : l'image du presse-papiers (Win+Maj+S, Impr. écran) part dans la
// zone d'import visible — celle survolée, sinon la première à l'écran
function pasteTarget(zone, handle) {
  zone.dataset.paste = "1";
  zone._paste = handle;
  if (!zone.querySelector(".paste-hint")) zone.append(el("span", { class: "paste-hint" }, " · ou collez-la avec Ctrl+V"));
}
function onPaste(e) {
  const items = [...(e.clipboardData?.items || [])].filter((i) => i.kind === "file" && i.type.startsWith("image/"));
  if (!items.length) return;  // texte : collage normal dans les champs
  const zones = [...document.querySelectorAll("[data-paste]")].filter((z) => z.isConnected && z.offsetParent !== null);
  const zone = zones.find((z) => z.closest(".ctx-back")) || zones.find((z) => z.matches(":hover")) || zones.find((z) => { const r = z.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; }) || zones[0];
  if (!zone) { toast("Aucune zone d'import ici : ouvrez un profil, l'armurerie ou l'onglet GvG pour coller une capture.", "warn"); return; }
  e.preventDefault();
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  const files = items.map((i, k) => { const f = i.getAsFile(); return new File([f], `capture-collee-${stamp}${k ? "-" + k : ""}.${(f.type.split("/")[1] || "png")}`, { type: f.type }); });
  zone.scrollIntoView({ behavior: "smooth", block: "center" });
  zone.classList.remove("pasted"); void zone.offsetWidth; zone.classList.add("pasted");
  toast(files.length > 1 ? `${files.length} captures collées` : "Capture collée", "ok");
  zone._paste(files);
}
document.addEventListener("paste", onPaste);
// La vitrine est une page intégrée (iframe) : quand elle a le focus (clic sur un héros, défilement),
// le Ctrl+V lui arrive à elle ; on le relaie ici. Même origine, donc accessible.
function relayPaste(frame) {
  frame.addEventListener("load", () => {
    try { frame.contentDocument.addEventListener("paste", (e) => { if (!e.defaultPrevented) onPaste(e); }); } catch { /* autre origine */ }
  });
}
// La fenêtre peut s'ouvrir sans que la page ait le focus clavier (Ctrl+V perdu) : on le lui donne.
addEventListener("load", () => window.focus());
addEventListener("focus", () => { if (!document.activeElement || document.activeElement === document.body) document.body.focus({ preventScroll: true }); });
function dropZone(text) {
  const input = el("input", { type: "file", accept: "image/png,image/jpeg,image/webp", multiple: "", hidden: "" });
  const drop = el("div", { class: "drop", onclick: () => input.click() }, text);
  input.addEventListener("change", () => importFiles([...input.files]));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); importFiles([...e.dataTransfer.files]); });
  pasteTarget(drop, (files) => importFiles(files));
  return [drop, input];
}
function reloadFrame() { const f = $("#frame"); if (f) f.src = f.src; }

function progressBox() {
  const fill = el("div", { class: "fill" });
  const pct = el("b", {}, "0 %"), msg = el("span", { class: "msg" }, "Préparation des captures…");
  const heroes = el("div", { class: "heroes" });
  const box = el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100" },
    el("div", { class: "head" }, msg, pct), el("div", { class: "track" }, fill), heroes);
  const seen = new Set();
  return {
    box,
    set(ratio, text) {
      const v = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      fill.style.width = v + "%"; pct.textContent = v + " %"; box.setAttribute("aria-valuenow", v);
      if (text) msg.textContent = text;
    },
    hero(name) { if (!seen.has(name)) { seen.add(name); heroes.append(el("span", {}, "✔ " + name)); } },
    finish() { box.classList.add("done"); },
  };
}

async function importFiles(files) {
  files = files.filter((f) => /\.(png|jpe?g|webp)$/i.test(f.name));
  if (!files.length) return;
  const report = $("#report");
  const bar = progressBox();
  report.replaceChildren(bar.box);
  try {
    // 1) envoi des captures en binaire, 3 à la fois (0 → 10 %)
    const uploads = new Array(files.length);
    let sent = 0, next = 0;
    const worker = async () => {
      while (next < files.length) {
        const i = next++, f = files[i];
        const res = await fetch(`/api/profiles/${current}/uploads`, { method: "POST", body: f,
          headers: { "X-E7-Token": TOKEN, "Content-Type": "application/octet-stream", "X-File-Name": encodeURIComponent(f.name) } });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `erreur ${res.status}`);
        uploads[i] = (await res.json()).id;
        bar.set((++sent / files.length) * 0.1, `Envoi ${sent}/${files.length} : ${f.name}`);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    const { job } = await json("POST", `/profiles/${current}/screenshots`, { uploads });
    // 2) analyse côté application (10 → 100 %)
    let state;
    for (;;) {
      state = await json("GET", "/jobs/" + job);
      bar.set(0.1 + 0.9 * (state.done / state.total), state.message);
      const m = /^(.+) ajouté$/.exec(state.message);
      if (m) bar.hero(m[1]);
      if (state.finished) break;
      await new Promise((r) => setTimeout(r, 300));
    }
    if (state.error) throw new Error(state.error);
    const r = state.report;
    r.heroes.forEach((h) => bar.hero(h));
    bar.set(1, `Terminé : ${r.heroes.length} héros ajouté(s)` + (r.items.length ? `, ${r.items.length} pièce(s) ajoutée(s) à l'armurerie` : ""));
    bar.finish();
    const lines = [bar.box];
    if (r.items.length) lines.push(el("div", { class: "ok" }, `Armurerie : ${r.items.join(" · ")}`));
    if (r.learned_sets.length) lines.push(el("div", { class: "transient" }, `Sets appris : ${r.learned_sets.join(", ")}`));
    for (const w of r.warnings) lines.push(el("div", { class: "warn" }, "⚠ " + w));
    if (r.ignored.length) lines.push(el("div", { class: "warn" }, `Captures non reconnues : ${r.ignored.join(", ")}`));
    report.replaceChildren(...lines);
    const keep = [...report.childNodes];
    await refresh(); await render(); $("#report")?.replaceChildren(...keep);
    bar.box.classList.add("transient");
    setTimeout(() => {
      const gone = keep.filter((n) => n.classList && n.classList.contains("transient"));
      gone.forEach((n) => n.classList.add("fading"));
      setTimeout(() => gone.forEach((n) => n.remove()), 600);
    }, 5000);
  } catch (e) { report.replaceChildren(el("span", { class: "err" }, e.message)); }
}

async function exportVitrine(id, player) {
  if (window.pywebview?.api?.save_vitrine) {
    const path = await window.pywebview.api.save_vitrine(id);
    if (path) toast("Vitrine enregistrée :\n" + path);
    return;
  }
  const res = await api("GET", `/profiles/${id}/export`);
  const name = (res.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || "vitrine.e7v";
  const url = URL.createObjectURL(await res.blob());
  el("a", { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function removeProfile(id, player) {
  if (!confirm(`Supprimer le profil « ${player} » de cet ordinateur ?`)) return;
  await api("DELETE", "/profiles/" + id); current = null; await refresh(); render();
}

// Rejeu animé du combat type : barres de PV, chiffres de dégâts et de soins, héros actif, K.O.
function replay(sample, labels) {
  const units = sample.units, frames = sample.frames, log = sample.log;
  const clean = (n) => n.replace(/ \(estimé\)$/, "");
  const cards = units.map((u) => {
    const fill = el("div", { class: "hpfill" }), shield = el("div", { class: "hpshield" }), lag = el("div", { class: "hplag" });
    const num = el("span", { class: "hpnum" });
    const card = el("div", { class: "fighter" }, portrait(clean(u.name), { size: "lg" }),
      el("div", { class: "fname" }, clean(u.name)), el("div", { class: "hpbar" }, lag, fill, shield), num);
    return { card, fill, shield, lag, num, u };
  });
  const side = (t) => el("div", { class: "side side-" + t }, el("div", { class: "side-label" }, labels[t]), ...cards.filter((c) => c.u.team === t).map((c) => c.card));
  const caption = el("div", { class: "replay-log", "aria-live": "polite" });
  const banner = el("div", { class: "replay-banner", hidden: "" });
  const turn = el("span", { class: "note" });
  let i = -1, timer = 0, speed = 1, playing = true;
  const prevHp = units.map((u) => u.max_hp);
  const paint = (hp, shield) => cards.forEach((c, k) => {
    const pct = Math.max(0, 100 * hp[k] / c.u.max_hp);
    c.fill.style.width = pct + "%"; c.lag.style.width = pct + "%";
    c.fill.classList.toggle("low", pct < 30);
    c.shield.style.width = Math.min(100, 100 * (shield?.[k] || 0) / c.u.max_hp) + "%";
    c.num.textContent = `${Math.round(hp[k]).toLocaleString("fr-FR")} / ${c.u.max_hp.toLocaleString("fr-FR")}`;
    c.card.classList.toggle("ko", hp[k] <= 0);
  });
  const pop = (card, text, kind) => {
    const n = el("span", { class: "dmg " + kind }, text);
    n.style.left = 30 + Math.random() * 40 + "%";
    card.append(n); n.addEventListener("animationend", () => n.remove());
  };
  const step = () => {
    i += 1;
    if (i >= frames.length) { finish(); return; }
    const f = frames[i], from = i ? frames[i - 1].line : 0;
    cards.forEach((c, k) => c.card.classList.toggle("active", k === f.actor));
    cards.forEach((c, k) => {
      const d = f.hp[k] - prevHp[k];
      if (Math.abs(d) >= 1) {
        pop(c.card, (d < 0 ? "−" : "+") + Math.abs(Math.round(d)).toLocaleString("fr-FR"), d < 0 ? "hit" : "heal");
        if (d < 0) { c.card.classList.remove("shake"); void c.card.offsetWidth; c.card.classList.add("shake"); }
        if (d < 0 && f.hp[k] <= 0) { const r = c.card.getBoundingClientRect(); fx.burst(r.left + r.width / 2, r.top + 30, 18); }
      }
      prevHp[k] = f.hp[k];
    });
    paint(f.hp, f.shield);
    caption.replaceChildren(...log.slice(from, f.line).map((l) => el("div", { class: l.trim().startsWith("↳") ? "sub" : "" }, l.trim())));
    turn.textContent = `Tour ${i + 1} / ${frames.length}`;
    timer = setTimeout(step, 900 / speed);
  };
  const finish = () => {
    playing = false; playBtn.textContent = "↻ Rejouer";
    cards.forEach((c) => c.card.classList.remove("active"));
    banner.hidden = false;
    banner.textContent = sample.winner == null ? "Match nul" : `Victoire : ${labels[sample.winner]}`;
    banner.className = "replay-banner " + (sample.winner == null ? "draw" : "t" + sample.winner);
    const r = banner.getBoundingClientRect(); fx.burst(r.left + r.width / 2, r.top + r.height / 2, 40);
  };
  const restart = () => {
    clearTimeout(timer); i = -1; banner.hidden = true; caption.replaceChildren();
    units.forEach((u, k) => { prevHp[k] = u.max_hp; }); paint(prevHp, null);
    playing = true; playBtn.textContent = "⏸ Pause"; timer = setTimeout(step, 500);
  };
  const playBtn = el("button", { class: "ghost", onclick: () => {
    if (i >= frames.length) return restart();
    playing = !playing; playBtn.textContent = playing ? "⏸ Pause" : "▶ Lecture";
    if (playing) step(); else clearTimeout(timer);
  } }, "⏸ Pause");
  const speedBtn = el("button", { class: "ghost", onclick: () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; speedBtn.textContent = `Vitesse ×${speed}`; } }, "Vitesse ×1");
  const box = el("div", { class: "replay" },
    el("div", { class: "arena" }, side(0), el("div", { class: "vs-mid" }, "VS"), side(1)), banner, caption,
    el("div", { class: "acts-row" }, playBtn, speedBtn, el("button", { class: "ghost", onclick: () => {
      if (i >= frames.length) return;
      clearTimeout(timer); i = frames.length - 2; step(); clearTimeout(timer); i = frames.length; finish();
    } }, "⏭ Fin"), turn));
  const stop = new MutationObserver(() => { if (!box.isConnected) { clearTimeout(timer); stop.disconnect(); } });
  stop.observe(document.body, { childList: true, subtree: true });
  restart();
  return box;
}

// Verdict de fin de simulation : vainqueur, taux de victoire qui monte, trophée, étincelles
function verdict(labels, wa, wb, draws, runs) {
  const close = Math.abs(wa - wb) < 10;  // écart sous 10 points : combat serré
  const side = wa >= wb ? 0 : 1, rate = Math.max(wa, wb);
  const pct = el("b", { class: "vd-pct" }, "0 %");
  const box = el("div", { class: `verdict ${close ? "close" : "t" + side}`, role: "status" },
    el("div", { class: "vd-rays", "aria-hidden": "true" }),
    el("div", { class: "vd-icon", "aria-hidden": "true" }, close ? "⚖" : "🏆"),
    el("div", { class: "vd-text" },
      el("span", { class: "vd-kicker" }, close ? "Combat serré" : "Victoire"),
      el("strong", { class: "vd-team" }, close ? `${labels[0]} ou ${labels[1]}` : labels[side]),
      el("span", { class: "vd-sub" }, pct, ` de victoires sur ${fmtN(runs)} combats` + (draws ? ` · ${draws} % de nuls` : ""))));
  const t0 = performance.now();
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / 1100), v = rate * (1 - Math.pow(1 - k, 3));
    pct.textContent = `${v.toFixed(1)} %`;
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  requestAnimationFrame(() => {  // résultat sous les formulaires : on l'amène à l'écran
    const r = box.getBoundingClientRect();
    if (box.isConnected && (r.top < 0 || r.bottom > innerHeight)) box.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  setTimeout(() => {  // gerbe une fois le bandeau en place
    if (!box.isConnected) return;
    const r = box.getBoundingClientRect();
    fx.burst(r.left + 60, r.top + r.height / 2, close ? 16 : 36);
    if (!close) fx.burst(r.left + r.width / 2, r.top + r.height / 2, 24);
  }, 450);
  return box;
}

async function uploadCapture(url, f) {

function captureZone(label, url, done) {
  const file = el("input", { type: "file", accept: "image/*", hidden: "" });
  const msg = el("p", { class: "note", role: "status" });
  const drop = el("div", { class: "drop", tabindex: "0", role: "button" }, label);
  const go = async (f) => {
    msg.style.color = ""; msg.textContent = "Lecture de la capture… (quelques secondes la première fois)";
    try { await uploadCapture(url, f); msg.textContent = ""; done(); }
    catch (e) { msg.textContent = e.message; msg.style.color = "var(--danger)"; }
  };
  file.addEventListener("change", () => { const f = file.files[0]; file.value = ""; if (f) go(f); });
  drop.addEventListener("click", () => file.click());

// Publication Discord d'une page GvG (suivi d'une guerre, contres) : même webhook que le plan
function pubCard({ title, desc, info, sendPath, autoFlag, autoLabel, confirmText }) {
  const box = el("div", { class: "card" }, el("h3", {}, title));
  const msg = el("p", { class: "note", role: "status" });
  const say = (text, ok) => { msg.textContent = text; msg.style.color = `var(${ok ? "--ok" : "--danger"})`; };
  const draw = async () => {
    const st = await json("GET", "/gvg/webhook");
    if (!st.configured) {
      box.replaceChildren(box.firstChild, el("p", { class: "note" }, "Enregistrez d'abord le webhook du salon dans l'onglet Défenses (carte « Exporter le plan de défense »)."));
      return;
    }
    const pub = info(st) || {};
    const send = el("button", { onclick: async () => {
      if (!confirm(confirmText)) return;
      send.disabled = true; say("Envoi en cours…", true);
      try { const r = await json("POST", sendPath); say(`Publié sur Discord (${r.sent} message${r.sent > 1 ? "s" : ""}).`, true); draw(); }
      catch (e) { say(e.message, false); send.disabled = false; }
    } }, pub.published ? "Publier un nouveau message" : "Envoyer sur Discord");
    const auto = el("input", { type: "checkbox" });
    auto.checked = st[autoFlag];
    auto.addEventListener("change", async () => {
      try { await json("PUT", "/gvg/webhook", { [autoFlag]: auto.checked }); say(auto.checked ? "Mise à jour automatique activée." : "Mise à jour automatique désactivée.", true); }
      catch (e) { say(e.message, false); }
    });
    const state = el("div", { class: "note" }, pub.last_error ? `⚠ ${pub.last_error}` : pub.last_sent ? `Dernière publication : ${pub.last_sent}` : "Pas encore publié.");
    if (pub.last_error) state.style.color = "var(--danger)";
    box.replaceChildren(box.firstChild, el("p", { class: "note" }, desc),
      el("div", { class: "simbox" }, send, el("label", { class: "autosend" }, auto, " " + autoLabel), state, msg));
  };
  draw().catch((e) => say(e.message, false));
  return box;
}

function gvgCounters(page, g) {

      el("div", { class: "ratio", title: `${c.wins} V / ${c.losses} D` }, el("span", { class: "w", style: `flex:${c.wins || 0.0001}` }), el("span", { class: "l", style: `flex:${c.losses || 0.0001}` })),
      el("div", { class: "counter-list" }, ...c.teams.map((t) => el("div", { class: "counter-row " + (t.wins && !t.losses ? "good" : !t.wins ? "bad" : "mixed") },

// ===== Mise à jour de Zealot depuis GitHub =====
(() => {
  const btn = $("#update-btn");
  const label = btn.textContent;
  const poll = async () => {
    const st = await json("GET", "/update/status");
    if (st.state === "downloading") {
      btn.textContent = `⬇ Téléchargement… ${st.total ? Math.round(100 * st.done / st.total) : 0} %`;
      return setTimeout(poll, 600);
    }
    if (st.state === "checking") return setTimeout(poll, 600);
    if (st.state === "installing") { btn.textContent = "⚙ Installation… Zealot va redémarrer"; toast("Installation de la mise à jour : Zealot se ferme puis redémarre tout seul."); return; }
    btn.disabled = false; btn.textContent = label;
    if (st.state === "uptodate") toast("Zealot est déjà à jour.");
    if (st.state === "error") toast(`Mise à jour impossible : ${st.error}`, "err");
  };
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "🔄 Recherche…";
    try {
      const info = await json("GET", "/update");
      if (!info.available) { toast(`Zealot est à jour (version ${info.current}).`); btn.disabled = false; btn.textContent = label; return; }
      if (!confirm(`Nouvelle version ${info.latest} disponible (installée : ${info.current}).\n\nLa télécharger et l'installer maintenant ? Zealot redémarrera, vos profils sont conservés.`)) { btn.disabled = false; btn.textContent = label; return; }
      await json("POST", "/update/install");
      poll();
    } catch (e) { toast(`Recherche impossible : ${e.message}`, "err"); btn.disabled = false; btn.textContent = label; }
  });
})();
// ===== Esthétique et animations : transitions, apparitions, particules (docs/UI_MOTION.md) =====
const fx = (() => {
  const root = document.documentElement, content = $("#content"), nav = $(".topnav");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const enabled = true;  // effets toujours actifs (sauf « réduire les animations » du système)
  const active = () => enabled && !reduced.matches;
  try { localStorage.removeItem("e7-fx"); } catch { /* stockage indisponible */ }

  // indicateur doré qui glisse sous l'onglet actif
  const ink = el("span", { class: "ink" }); nav.append(ink);
  const moveInk = () => {
    const b = nav.querySelector('button[aria-selected="true"]');
    if (!b) { ink.style.width = "0"; return; }
    ink.style.left = b.offsetLeft + "px"; ink.style.width = b.offsetWidth + "px";
  };
  new MutationObserver(moveInk).observe(nav, { attributes: true, subtree: true, attributeFilter: ["aria-selected"] });
  addEventListener("resize", moveInk);

  // transition entre onglets : sortie rapide, puis entrée glissée dans le sens de navigation
  let entering = "enter";
  const transition = (dir, run) => {
    if (!active()) { run(); return; }
    content.classList.remove("enter", "enter-l", "enter-r");
    content.classList.add("leave");
    setTimeout(() => { content.classList.remove("leave"); entering = "enter-" + dir; run(); }, 150);
  };

  // apparition en cascade des cartes, tuiles et pièces à chaque nouveau contenu
  const STAGGER = ".card, .tile, .gear, .bar, .drop, .progress, .empty, table.members tbody tr";
  const decorate = (scope) => {
    let i = 0;
    scope.querySelectorAll(STAGGER).forEach((n) => {
      if (n.dataset.fx) return;
      n.dataset.fx = "1";
      if (!active() || i > 40) return;
      n.style.setProperty("--i", String(i++)); n.classList.add("reveal");
      n.addEventListener("animationend", () => n.classList.remove("reveal"), { once: true });
    });
    scope.querySelectorAll(".tile b").forEach(countUp);
    scope.querySelectorAll(".wins").forEach((w) => { if (!w.dataset.fx) { w.dataset.fx = "1"; burstAt(w); } });
  };
  let pending = 0;
  new MutationObserver((records) => {
    if (records.some((r) => r.target === content && r.addedNodes.length)) {
      content.classList.remove("enter", "enter-l", "enter-r");
      if (active()) { void content.offsetWidth; content.classList.add(entering); }
      entering = "enter";
    }
    if (!pending) pending = requestAnimationFrame(() => { pending = 0; decorate(content); });  // une fois par image
  }).observe(content, { childList: true, subtree: true });
  new MutationObserver(() => $("#list").querySelectorAll(".item").forEach((n, i) => n.style.setProperty("--i", String(i))))
    .observe($("#list"), { childList: true });

  // compteurs animés des tuiles (« 1 234 » monte depuis 0)
  function countUp(b) {
    const text = b.textContent, m = text.match(/^([\d\s  ]+)(.*)$/);
    if (b.dataset.counted === text || !m || !active()) { b.dataset.counted = text; return; }
    const target = Number(m[1].replace(/\D/g, "")), rest = m[2], t0 = performance.now();

    const step = (t) => {
      const k = Math.min(1, (t - t0) / 900), v = Math.round(target * (1 - Math.pow(1 - k, 3)));

    b.append(dot); dot.addEventListener("animationend", () => dot.remove());

    if (!c) return;

      ph: Math.random() * 6.28, gold: Math.random() < 0.7 };

      const ang = Math.random() * 6.28, sp = 1 + Math.random() * 3.5;
      sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1, life: 1, r: 1 + Math.random() * 2, gold: Math.random() < 0.8 });
    }

      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.28); ctx.fill();

  document.addEventListener("visibilitychange", () => { last = 0; wake(); });

})();
