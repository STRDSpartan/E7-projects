<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E7 Showcase</title>
<style>
:root { --bg:#0b0e15; --panel:#141925; --panel-2:#1b2130; --line:#283044; --text:#e8ecf3; --muted:#8e98aa;
  --gold:#e8c26a; --accent:#4ab3ff; --danger:#e26060; --ok:#7fe0a0; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif;
  display:grid; grid-template-columns: 260px minmax(0,1fr); height:100vh; }
aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.brand { padding:16px; font-weight:800; letter-spacing:.06em; color:var(--gold); font-size:17px; }
.brand small { display:block; color:var(--muted); font-weight:400; letter-spacing:0; font-size:12px; }
.list { flex:1; overflow:auto; padding:0 8px; }
.list h3 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:14px 8px 6px; letter-spacing:.08em; }
.item { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); padding:8px 10px;
  border-radius:8px; cursor:pointer; }
.item:hover { background:var(--panel-2); } .item.active { background:#22304c; }
.item small { display:block; color:var(--muted); }
.side-actions { padding:12px; display:grid; gap:8px; border-top:1px solid var(--line); }
button { font:inherit; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--gold); color:#1d1606; font-weight:600; }
button.ghost { background:var(--panel-2); color:var(--text); font-weight:500; }
button.danger { background:transparent; color:var(--danger); border:1px solid #5a2a2a; }
button:disabled { opacity:.5; cursor:default; }
main { display:flex; flex-direction:column; min-height:0; }
.bar { display:flex; gap:10px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.bar h1 { margin:0; font-size:20px; flex:1; min-width:0; }
.bar h1 input { background:transparent; border:1px solid transparent; color:var(--text); font:inherit; font-weight:700; width:100%; padding:2px 6px; border-radius:6px; }
.bar h1 input:hover, .bar h1 input:focus { border-color:var(--line); outline:none; }
.badge { font-size:12px; color:var(--accent); border:1px solid #2a4b6b; border-radius:999px; padding:2px 10px; }
.drop { margin:12px 16px 0; border:2px dashed var(--line); border-radius:12px; padding:14px; text-align:center; color:var(--muted); cursor:pointer; }
.drop.over { border-color:var(--gold); color:var(--text); background:#1a1c14; }
.report { margin:8px 16px 0; font-size:13px; }
.report .transient { transition: opacity .6s ease; } .report .fading { opacity: 0; }
.report .ok { color:var(--ok); } .report .warn { color:var(--gold); } .report .err { color:var(--danger); }
.progress { margin:10px 16px 0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
.progress .head { display:flex; justify-content:space-between; gap:12px; font-size:13px; margin-bottom:8px; }
.progress .head b { color:var(--gold); font-variant-numeric:tabular-nums; }
.progress .msg { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.track { height:12px; background:#0f131c; border-radius:999px; overflow:hidden; border:1px solid #232a3b; }
.fill { height:100%; width:0; border-radius:999px; transition:width .45s ease;
  background:linear-gradient(90deg, #b8892f, var(--gold) 50%, #fff0c2);
  background-size:200% 100%; position:relative; animation:shine 2.2s linear infinite; }
.fill::after { content:""; position:absolute; inset:0; border-radius:inherit;
  background:repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px);
  background-size:28px 28px; animation:stripes .8s linear infinite; }
.progress.done .fill { animation:none; background:var(--ok); } .progress.done .fill::after { display:none; }
.progress .heroes { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.progress .heroes span { font-size:12px; background:#1f2a1f; color:var(--ok); border-radius:999px; padding:2px 10px; animation:pop .35s ease; }
@keyframes stripes { to { background-position:28px 0; } }
@keyframes shine { to { background-position:-200% 0; } }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .fill, .fill::after, .progress .heroes span { animation:none; } }
iframe { flex:1; border:0; width:100%; margin-top:10px; background:var(--bg); }
.empty { margin:auto; text-align:center; color:var(--muted); max-width:520px; padding:24px; }
.empty h2 { color:var(--text); }
.sim { padding:16px; overflow:auto; display:grid; gap:14px; align-content:start; }
.tabs { display:flex; gap:6px; } .tabs button { background:var(--panel-2); color:var(--text); font-weight:500; }
.tabs button[aria-pressed="true"] { background:var(--gold); color:#1d1606; font-weight:700; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
.card h3 { margin:0 0 10px; font-size:15px; color:var(--gold); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
.field { display:grid; gap:4px; font-size:13px; color:var(--muted); }
.field select, .field input { width:100%; min-width:0; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px; font:inherit; }
.checks { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; }
table.res { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
table.res th, table.res td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:right; }
table.res th:first-child, table.res td:first-child { text-align:left; }
table.res td.crit { color:var(--gold); font-weight:700; } table.res td.exp { color:var(--ok); font-weight:700; }
.note { font-size:12px; color:var(--muted); }
.wins { display:flex; height:28px; border-radius:8px; overflow:hidden; font-weight:700; font-size:13px; }
.wins div { display:grid; place-items:center; min-width:0; overflow:hidden; white-space:nowrap; }
.log { font:12.5px/1.6 ui-monospace, Consolas, monospace; background:#0d111a; border:1px solid var(--line); border-radius:8px;
  padding:10px; max-height:360px; overflow:auto; white-space:pre-wrap; }
.empty ol { text-align:left; }
dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:18px; }
dialog input { width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; margin:10px 0; font:inherit; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); } aside { max-height: 40vh; } }
</style>
</head>
<body>
<aside>
  <div class="brand">E7 SHOWCASE<small>Vitrines Epic Seven</small></div>
  <div class="list" id="list"></div>
  <div class="side-actions">
    <button class="ghost" id="sims">⚔ Simulateurs</button>
    <button id="new">+ Nouveau profil</button>
    <button class="ghost" id="open">Ouvrir une vitrine (.e7v)</button>
    <input type="file" id="open-file" accept=".e7v" hidden>
  </div>
</aside>
<main id="main"></main>

<dialog id="dlg">
  <form id="dlg-form">
    <strong>Nom du joueur</strong>
    <input id="dlg-name" maxlength="40" placeholder="Pseudo en jeu" required>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ghost" id="dlg-cancel">Annuler</button>
      <button type="submit">Créer</button>
    </div>
  </form>
</dialog>

<script>
const TOKEN = "__TOKEN__";
const $ = (s) => document.querySelector(s);
let profiles = [], current = null;

async function api(method, path, body) {
  const res = await fetch("/api" + path, {
    method, headers: { "X-E7-Token": TOKEN, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let msg = "Erreur " + res.status;
    try { msg = (await res.json()).error || msg; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res;
}
const json = async (m, p, b) => (await api(m, p, b)).json();
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? (n.className = v) : k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v);
  for (const c of kids) n.append(c);
  return n;
};
const toB64 = (file) => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(file); });

async function refresh(select) {
  profiles = await json("GET", "/profiles");
  const list = $("#list"); list.replaceChildren();
  const mine = profiles.filter((p) => !p.received), recv = profiles.filter((p) => p.received);
  for (const [title, group] of [["Mes profils", mine], ["Vitrines reçues", recv]]) {
    if (!group.length) continue;
    list.append(el("h3", {}, title));
    for (const p of group) list.append(el("button", { class: "item" + (p.id === (select || current) ? " active" : ""), "data-id": p.id, onclick: () => show(p.id) },
      p.player, el("small", {}, `${p.heroes} héros · ${p.updated_at}`)));
  }
  if (select) show(select); else if (!current) welcome();
}

function welcome() {
  current = null;
  $("#main").replaceChildren(el("div", { class: "empty" },
    el("h2", {}, "Bienvenue"),
    el("p", {}, "Créez votre profil, puis ajoutez les captures d'écran de vos héros."),
    el("ol", {},
      el("li", {}, "Dans le jeu : Héros → choisissez un héros → bouton sous les bottes → « Infos de héros »."),
      el("li", {}, "Faites une capture (Impr. écran ou Win+Maj+S) pour chaque héros."),
      el("li", {}, "Pour reconnaître les sets, ajoutez aussi une capture de la liste des héros (lignes « Set … »)."),
      el("li", {}, "Glissez toutes les captures dans l'application : la vitrine se construit seule.")),
    el("p", {}, "Quelqu'un vous a envoyé sa vitrine ? « Ouvrir une vitrine (.e7v) ».")));
}

async function show(id) {
  current = id;
  document.querySelectorAll(".item").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
  const p = await json("GET", "/profiles/" + id);
  const name = el("input", { value: p.player, maxlength: "40", "aria-label": "Nom du joueur" });
  if (p.received) name.setAttribute("readonly", "");
  else name.addEventListener("change", async () => { await api("PATCH", "/profiles/" + id, { player: name.value }); reloadFrame(); refresh(); });
  const bar = el("div", { class: "bar" }, el("h1", {}, name),
    p.received ? el("span", { class: "badge" }, "Vitrine reçue") : "",
    el("button", { onclick: () => exportVitrine(id, p.player) }, "Exporter la vitrine"),
    el("button", { class: "danger", onclick: () => removeProfile(id, p.player) }, "Supprimer"));
  const kids = [bar];
  const report = el("div", { class: "report", id: "report" });
  if (!p.received) {
    const input = el("input", { type: "file", accept: "image/png,image/jpeg,image/webp", multiple: "", hidden: "" });
    const drop = el("div", { class: "drop", onclick: () => input.click() },
      "Glissez ici vos captures (Infos de héros, liste des héros) — ou cliquez pour les choisir");
    input.addEventListener("change", () => importFiles([...input.files]));
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); importFiles([...e.dataTransfer.files]); });
    kids.push(drop, input);
  }
  kids.push(report);
  if (p.heroes.length) kids.push(el("iframe", { id: "frame", src: "/profile/" + id, title: "Vitrine" }));
  else kids.push(el("div", { class: "empty" }, p.received ? "Cette vitrine ne contient aucun héros." : "Aucun héros pour l'instant : ajoutez vos captures ci-dessus."));
  $("#main").replaceChildren(...kids);
}
function reloadFrame() { const f = $("#frame"); if (f) f.src = f.src; }

function progressBox() {
  const fill = el("div", { class: "fill" });
  const pct = el("b", {}, "0 %"), msg = el("span", { class: "msg" }, "Préparation des captures…");
  const heroes = el("div", { class: "heroes" });
  const box = el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100" },
    el("div", { class: "head" }, msg, pct), el("div", { class: "track" }, fill), heroes);
  const seen = new Set();
  return {
    box,
    set(ratio, text) {
      const v = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      fill.style.width = v + "%"; pct.textContent = v + " %"; box.setAttribute("aria-valuenow", v);
      if (text) msg.textContent = text;
    },
    hero(name) { if (!seen.has(name)) { seen.add(name); heroes.append(el("span", {}, "✔ " + name)); } },
    finish() { box.classList.add("done"); },
  };
}

async function importFiles(files) {
  files = files.filter((f) => /\.(png|jpe?g|webp)$/i.test(f.name));
  if (!files.length) return;
  const report = $("#report");
  const bar = progressBox();
  report.replaceChildren(bar.box);
  try {
    // 1) lecture des fichiers (0 → 10 %)
    const encoded = [];
    for (const [i, f] of files.entries()) {
      bar.set((i / files.length) * 0.1, `Préparation ${i + 1}/${files.length} : ${f.name}`);
      encoded.push({ name: f.name, data: await toB64(f) });
    }
    bar.set(0.1, "Envoi des captures…");
    const { job } = await json("POST", `/profiles/${current}/screenshots`, { files: encoded });
    // 2) analyse côté application (10 → 100 %)
    let state;
    for (;;) {
      state = await json("GET", "/jobs/" + job);
      bar.set(0.1 + 0.9 * (state.done / state.total), state.message);
      const m = /^(.+) ajouté$/.exec(state.message);
      if (m) bar.hero(m[1]);
      if (state.finished) break;
      await new Promise((r) => setTimeout(r, 300));
    }
    if (state.error) throw new Error(state.error);
    const r = state.report;
    r.heroes.forEach((h) => bar.hero(h));
    bar.set(1, `Terminé : ${r.heroes.length} héros ajouté(s)`);
    bar.finish();
    const lines = [bar.box];
    if (r.learned_sets.length) lines.push(el("div", { class: "transient" }, `Sets appris : ${r.learned_sets.join(", ")}`));
    for (const w of r.warnings) lines.push(el("div", { class: "warn" }, "⚠ " + w));
    if (r.ignored.length) lines.push(el("div", { class: "warn" }, `Captures non reconnues : ${r.ignored.join(", ")}`));
    report.replaceChildren(...lines);
    const keep = [...report.childNodes];
    await refresh(); await show(current); $("#report").replaceChildren(...keep);
    bar.box.classList.add("transient");
    setTimeout(() => {
      const gone = keep.filter((n) => n.classList && n.classList.contains("transient"));
      gone.forEach((n) => n.classList.add("fading"));
      setTimeout(() => gone.forEach((n) => n.remove()), 600);
    }, 5000);
  } catch (e) { report.replaceChildren(el("span", { class: "err" }, e.message)); }
}

async function exportVitrine(id, player) {
  if (window.pywebview?.api?.save_vitrine) {
    const path = await window.pywebview.api.save_vitrine(id);
    if (path) alert("Vitrine enregistrée :\n" + path);
    return;
  }
  const res = await api("GET", `/profiles/${id}/export`);
  const name = (res.headers.get("Content-Disposition") || "").match(/filename="(.+)"/)?.[1] || "vitrine.e7v";
  const url = URL.createObjectURL(await res.blob());
  el("a", { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function removeProfile(id, player) {
  if (!confirm(`Supprimer le profil « ${player} » de cet ordinateur ?`)) return;
  await api("DELETE", "/profiles/" + id); current = null; refresh();
}

// --- Simulateurs (dégâts, combat) : calculs côté application (calc/damage.py, calc/battle.py)
const fmtN = (n) => n == null ? "—" : Math.round(n).toLocaleString("fr-FR");
const pick = (heroes, label, empty) => el("select", { "aria-label": label },
  empty ? el("option", { value: "" }, empty) : "",
  ...heroes.map((h) => el("option", { value: h.ref, ...(h.simulable ? {} : { disabled: "" }) },
    `${h.name} — ${h.profile}${h.simulable ? "" : " (non simulable)"}`)));
const field = (label, input) => el("label", { class: "field" }, label, input);
const check = (label, key) => { const c = el("input", { type: "checkbox", "data-k": key }); return el("label", {}, c, " " + label); };
function readOptions(root) {
  const o = { molagoras: true };
  root.querySelectorAll("[data-k]").forEach((n) => { o[n.dataset.k] = n.type === "checkbox" ? n.checked : n.value; });
  if (o.elemental_advantage === "auto") delete o.elemental_advantage; else if ("elemental_advantage" in o) o.elemental_advantage = o.elemental_advantage === "yes";
  return o;
}
function optionsCard() {
  const sel = (key, entries) => el("select", { "data-k": key }, ...entries.map(([v, t]) => el("option", { value: v }, t)));
  return el("div", { class: "card" }, el("h3", {}, "Conditions"),
    el("div", { class: "grid2" },
      field("Buff d'attaque", sel("attack_buff", [["none", "Aucun"], ["up", "Attaque +50 %"], ["great", "Attaque +75 %"], ["down", "Attaque réduite −50 %"]])),
      field("Défense de la cible", sel("target_defense_buff", [["none", "Normale"], ["up", "Défense +60 %"], ["down", "Défense réduite −70 %"]])),
      field("Avantage élémentaire", sel("elemental_advantage", [["auto", "Selon les éléments"], ["yes", "Oui (+10 %)"], ["no", "Non"]])),
      field("Bonus de dégâts (%)", el("input", { type: "number", value: "0", "data-k": "damage_increase" })),
      field("Réduction de dégâts de la cible (%)", el("input", { type: "number", value: "0", min: "0", max: "100", "data-k": "damage_reduction" }))),
    el("div", { class: "checks", style: "margin-top:10px" }, check("Set Pénétration", "penetration_set"), check("Set Rage (cible affaiblie)", "rage_set"),
      check("Set Tumulte", "torrent_set")));
}
async function simulators(tab = "damage") {
  current = null;
  document.querySelectorAll(".item").forEach((b) => b.classList.remove("active"));
  const heroes = await json("GET", "/sim/heroes");
  const usable = heroes.filter((h) => h.simulable);
  const tabs = el("div", { class: "tabs" },
    el("button", { "aria-pressed": String(tab === "damage"), onclick: () => simulators("damage") }, "Simulateur de dégâts"),
    el("button", { "aria-pressed": String(tab === "battle"), onclick: () => simulators("battle") }, "Simulateur de combat"));
  const bar = el("div", { class: "bar" }, el("h1", {}, "Simulateurs"), tabs);
  const body = el("div", { class: "sim" });
  if (!usable.length) body.append(el("div", { class: "empty" }, "Ajoutez d'abord des héros à un profil : leurs stats servent aux simulations."));
  else if (tab === "damage") damagePage(body, heroes); else battlePage(body, heroes);
  $("#main").replaceChildren(bar, body);
}
function damagePage(body, heroes) {
  const attacker = pick(heroes, "Attaquant");
  const target = pick(heroes, "Cible", "Cible personnalisée (défense et PV ci-dessous)");
  const def = el("input", { type: "number", value: "1000", min: "0" }), hp = el("input", { type: "number", value: "20000", min: "1" });
  const out = el("div", {});
  const opts = optionsCard();
  const run = async () => {
    out.replaceChildren(el("p", { class: "note" }, "Calcul…"));
    try {
      const r = await json("POST", "/sim/damage", { attacker: attacker.value, options: readOptions(opts),
        target: target.value ? { ref: target.value } : { def: def.value, hp: hp.value } });
      const cond = r.rows.filter((x) => x.conditional.length);
      out.replaceChildren(el("div", { class: "card" }, el("h3", {}, `${r.attacker} → ${r.target}`),
        el("table", { class: "res" }, el("thead", {}, el("tr", {}, ...["Compétence", "Normal", "Critique", "Écrasant", "Raté", "Moyenne*"].map((t) => el("th", {}, t)))),
          el("tbody", {}, ...r.rows.map((x) => el("tr", {}, el("td", {}, x.skill + (x.aoe ? " · zone" : "") + (x.conditional.length ? " †" : "")),
            el("td", {}, fmtN(x.normal)), el("td", { class: "crit" }, fmtN(x.crit)), el("td", {}, fmtN(x.crush)), el("td", {}, fmtN(x.miss)), el("td", { class: "exp" }, fmtN(x.expected)))))),
        el("p", { class: "note" }, "* Moyenne pondérée par les chances de critique de l'attaquant. Compétences améliorées au maximum (molagoras)."),
        cond.length ? el("p", { class: "note" }, "† Bonus conditionnel propre au héros non appliqué (" + [...new Set(cond.flatMap((x) => x.conditional))].join(", ") + ") : les dégâts réels peuvent être plus élevés.") : ""));
    } catch (e) { out.replaceChildren(el("p", { class: "note", style: "color:var(--danger)" }, e.message)); }
  };
  body.append(el("div", { class: "card" }, el("h3", {}, "Combattants"),
    el("div", { class: "grid2" }, field("Attaquant (stats de son profil)", attacker), field("Cible", target),
      field("Défense de la cible personnalisée", def), field("PV de la cible personnalisée", hp)),
    el("div", { style: "margin-top:12px" }, el("button", { onclick: run }, "Calculer les dégâts"))), opts, out);
}
function battlePage(body, heroes) {
  const team = (label) => [0, 1, 2, 3].map((i) => pick(heroes, `${label} ${i + 1}`, i ? "—" : null));
  const a = team("Équipe A"), b = team("Équipe B");
  b[0].selectedIndex = Math.min(1, b[0].options.length - 1);
  const runs = el("input", { type: "number", value: "1000", min: "1", max: "5000" });
  const cd2 = el("input", { type: "number", value: "3", min: "0", max: "10" }), cd3 = el("input", { type: "number", value: "4", min: "0", max: "10" });
  const out = el("div", {});
  const opts = optionsCard();
  const run = async () => {
    out.replaceChildren(el("p", { class: "note" }, "Simulation…"));
    try {
      const r = await json("POST", "/sim/battle", { team_a: a.map((s) => s.value).filter(Boolean), team_b: b.map((s) => s.value).filter(Boolean),
        runs: runs.value, cooldowns: { s2: cd2.value, s3: cd3.value }, options: readOptions(opts) });
      const [wa, wb] = r.win_rate;
      out.replaceChildren(el("div", { class: "card" }, el("h3", {}, `Résultat sur ${fmtN(r.runs)} combats`),
        el("div", { class: "wins" }, el("div", { style: `width:${wa}%;background:#2f6fb3` }, wa >= 8 ? `A ${wa} %` : ""),
          el("div", { style: `width:${r.draws}%;background:#555` }, r.draws >= 8 ? `Nul ${r.draws} %` : ""),
          el("div", { style: `width:${wb}%;background:#b33f3f` }, wb >= 8 ? `B ${wb} %` : "")),
        el("p", {}, `Équipe A (${r.teams[0].join(", ")}) : ${wa} % de victoires · Équipe B (${r.teams[1].join(", ")}) : ${wb} % · ${r.avg_actions} actions en moyenne.`),
        el("h3", { style: "margin-top:12px" }, "Déroulé d'un combat type"),
        el("div", { class: "log" }, r.sample.log.join("\n") || "—"),
        el("p", { class: "note" }, "Modèle simplifié : jauge de combat selon la vitesse, S3 puis S2 puis S1 selon les temps de recharge, cible aux PV les plus bas, critiques tirés au hasard. Soins, barrières, buffs/débuffs des compétences, passifs, artefacts, esquive et contre-attaques ne sont pas simulés.")));
    } catch (e) { out.replaceChildren(el("p", { class: "note", style: "color:var(--danger)" }, e.message)); }
  };
  body.append(el("div", { class: "grid2" },
      el("div", { class: "card" }, el("h3", {}, "Équipe A"), ...a.map((s, i) => field(`Héros ${i + 1}`, s))),
      el("div", { class: "card" }, el("h3", {}, "Équipe B"), ...b.map((s, i) => field(`Héros ${i + 1}`, s)))),
    el("div", { class: "card" }, el("h3", {}, "Paramètres"),
      el("div", { class: "grid2" }, field("Nombre de combats simulés", runs), field("Recharge S2 (tours)", cd2), field("Recharge S3 (tours)", cd3)),
      el("div", { style: "margin-top:12px" }, el("button", { onclick: run }, "Lancer la simulation"))), opts, out);
}
$("#sims").onclick = () => simulators();

$("#new").onclick = () => { $("#dlg-name").value = ""; $("#dlg").showModal(); };
$("#dlg-cancel").onclick = () => $("#dlg").close();
$("#dlg-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const player = $("#dlg-name").value.trim();
  if (!player) return;
  $("#dlg").close();
  try { const r = await json("POST", "/profiles", { player }); await refresh(r.id); }
  catch (err) { alert(err.message); }
});
$("#open").onclick = () => $("#open-file").click();
$("#open-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try { const r = await json("POST", "/open", { name: f.name, data: await toB64(f) }); refresh(r.id); }
  catch (err) { alert(err.message); }
});
const start = new URLSearchParams(location.hash.slice(1)).get("p");
refresh(start || undefined);
</script>
</body>
