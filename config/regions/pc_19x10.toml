# Profil PC : client Windows en fenêtre agrandie sur un écran 1920x1080 (zone cliente
# 1919x1009 sans barre de titre ni barre des tâches, format ≈ 1,90). Calibré sur de vraies
# captures de la fiche « Infos de héros » et de la liste des héros du client FR.
# Coordonnées NORMALISÉES [x, y, largeur, hauteur] relatives à la zone cliente.

aspect = 1.902

[detail]
title       = [0.040, 0.015, 0.200, 0.060]   # « Infos de héros » (sert à reconnaître l'écran)
classes     = [0.040, 0.112, 0.240, 0.055]   # élément · classe · signe
name        = [0.020, 0.150, 0.400, 0.080]
level       = [0.020, 0.258, 0.130, 0.062]
imprint     = [0.075, 0.320, 0.170, 0.135]
power       = [0.045, 0.445, 0.090, 0.060]   # puissance de combat
artifact    = [0.835, 0.120, 0.137, 0.090]
gear_score  = [0.680, 0.268, 0.240, 0.050]   # « Score moyen d'équipements : 92 »
stats_icons = [0.024, 0.5035, 0.020, 0.294]  # 9 lignes, une icône par ligne
stats_labels= [0.046, 0.5035, 0.136, 0.294]
stats_values= [0.184, 0.5035, 0.052, 0.294]
stats_rows  = 9

[detail.gear]
