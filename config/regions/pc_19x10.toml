helmet   = [0.7570, 0.5130]
armor    = [0.7570, 0.6900]
necklace = [0.9210, 0.3360]
ring     = [0.9210, 0.5130]
boots    = [0.9210, 0.6900]

[detail.gear_layout]
# Boîtes relatives à l'ancre [dx, dy, largeur, hauteur]
icon_w     = 0.0130
values_dx  = 0.0130
values_w   = 0.0410
line_dy    = [0.0000, 0.0340, 0.0618, 0.0896, 0.1174]   # principale puis 4 secondaires
