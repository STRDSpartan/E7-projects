[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "e7showcase"
version = "0.1.0"
description = "Scanner de roster Epic Seven (client PC) et générateur de vitrines partageables sur Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "pillow>=10.3",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
# Capture d'écran + OCR (nécessaire uniquement pour scanner le client PC)
scan = [
  "mss>=9.0",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "rapidocr-onnxruntime>=1.3",
  "pywin32>=306; sys_platform == 'win32'",
  "keyboard>=0.13",
]
# Rendu HTML -> PNG haute fidélité
render = ["playwright>=1.44"]
# Bot Discord (slash commands)
bot = ["discord.py>=2.3"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
e7showcase = "e7showcase.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/e7showcase"]

[tool.hatch.build.targets.wheel.force-include]
"data/reference" = "e7showcase/_reference"
"config" = "e7showcase/_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
# discord.py expose des décorateurs non typés
module = "e7showcase.publish.bot"
disallow_untyped_decorators = false
