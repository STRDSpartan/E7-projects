[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "e7showcase"
version = "0.66.0"
description = "Scanner de roster Epic Seven (client PC) et générateur de vitrines partageables sur Discord."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "pillow>=10.3",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Correspondance approximative rapide (repli pur Python sans elle : e7showcase.fuzzy, cas du mobile)
fast = ["rapidfuzz>=3.9"]
# Capture d'écran + OCR (nécessaire uniquement pour scanner le client PC)
scan = [
  "rapidfuzz>=3.9",
  "mss>=9.0",
  "opencv-python-headless>=4.9",
  "rapidocr-onnxruntime>=1.3",
  "pywin32>=306; sys_platform == 'win32'",
  "keyboard>=0.13",
]
# Application de bureau (fenêtre native) : `e7showcase-app`
app = [
  "rapidfuzz>=3.9",
  "pywebview>=5.0",
  "opencv-python-headless>=4.9",
  "rapidocr-onnxruntime>=1.3",
]
# Rendu HTML -> PNG haute fidélité
render = ["playwright>=1.44"]
# Bot Discord (slash commands)
bot = ["discord.py>=2.3"]
dev = [
  "rapidfuzz>=3.9",
  "opencv-python-headless>=4.9",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
e7showcase = "e7showcase.cli:app"

[project.gui-scripts]
e7showcase-app = "e7showcase.app.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/e7showcase"]

[tool.hatch.build.targets.wheel.force-include]
"data/reference" = "e7showcase/_reference"
"config" = "e7showcase/_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
# discord.py expose des décorateurs non typés
module = "e7showcase.publish.bot"
disallow_untyped_decorators = false

# ----- Zealot mobile (Android, iOS) : BeeWare Briefcase, voir docs/MOBILE.md -----
[tool.briefcase]
project_name = "Zealot"
bundle = "com.shatteredspartan"
version = "0.66.0"
url = "https://github.com/STRDSpartan/E7-projects"
license.file = "LICENSE"
author = "Shattered Spartan"
author_email = "noreply@example.com"

[tool.briefcase.app.zealot]
formal_name = "Zealot"
description = "Compagnon Epic Seven : vitrines, simulateurs, guilde et guerres de guilde."
long_description = "Zealot sur mobile : le même cœur et la même interface que l'application PC."
icon = "build/mobile-icons/zealot"
# sources préparées par scripts/prepare_mobile.py (données de référence copiées dans le paquet)
sources = ["build/mobile-src/e7showcase", "mobile/zealot"]
# pydantic-core compilé pour Android/iOS par la CI (dossier wheels/, voir docs/MOBILE.md)
requirement_installer_args = ["--find-links", "./wheels"]
requires = [
  "pydantic==2.14.1",
  "jinja2>=3.1",
  "pillow>=10.3",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "numpy>=1.26",
]  # rapidfuzz : pas de version mobile, repli pur Python (e7showcase.fuzzy)

[tool.briefcase.app.zealot.android]
requires = ["toga-android~=0.5.0"]
# barres système aux couleurs de Zealot (bleu nuit) au lieu du vert par défaut
primary_color = "#060818"
primary_color_dark = "#060818"
accent_color = "#b9a0ff"
# l'interface est servie par le serveur local de l'app (http://127.0.0.1)
android_manifest_application_attrs_extra_content = 'android:usesCleartextTraffic="true"'

[tool.briefcase.app.zealot.iOS]
requires = ["toga-iOS~=0.5.0"]
info."NSAppTransportSecurity".NSAllowsLocalNetworking = true
