name: Application Windows

# Construit l'installateur Windows à chaque push sur la branche de travail ou sur main
# (artefact téléchargeable dans l'onglet Actions) et le publie en Release sur un tag v*.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[app]" pyinstaller
      - name: Vérification rapide
        run: python -c "import e7showcase.app.launcher, rapidocr_onnxruntime, webview"
      - name: Icône et images de l'installateur
        run: python scripts/make_icon.py packaging/windows/build
      - run: pyinstaller packaging/e7showcase-app.spec --noconfirm
      - name: Test de démarrage (fenêtre native)
        shell: pwsh
        run: |
          $env:E7_DATA_DIR = "$env:RUNNER_TEMP\e7data"
          $log = "$env:E7_DATA_DIR\e7showcase.log"
          $p = Start-Process dist\E7Showcase\E7Showcase.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "window-loaded" -Quiet)) { $ok = $true; break }
            if ($p.HasExited) { break }
          }
          $alive = -not $p.HasExited
          if (-not $ok -or -not $alive) {
            if ($alive) { Stop-Process -Id $p.Id -Force }
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::log: $_" }
            Write-Host "::error::la fenêtre de l'application ne s'est pas chargée"
            exit 1
          }
          # Fermeture comme un utilisateur (bouton ✕) : tous les processus doivent s'arrêter
          Start-Sleep -Seconds 3
          $p.Refresh(); $null = $p.CloseMainWindow()
          $closed = $p.WaitForExit(20000)
          Get-Content $log -ErrorAction SilentlyContinue
          $left = Get-Process -Name E7Showcase -ErrorAction SilentlyContinue
          if (-not $closed -or $left) {
            $left | Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $closed) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host "::error::le processus reste actif après la fermeture de la fenêtre"
            exit 1
          }
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path src/e7showcase/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Version : $version"
          $out = & $iscc "/DAppVersion=$version" packaging\windows\installer.iss 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $out | Select-Object -Last 15 | ForEach-Object { Write-Host "::error::iscc: $_" }
            exit $LASTEXITCODE
          }
      - name: Version portable (sans installation)
        shell: pwsh
        run: Compress-Archive -Path dist\E7Showcase -DestinationPath dist\E7Showcase-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: E7Showcase-Windows
          path: |
            dist/E7Showcase-Setup-*.exe
            dist/E7Showcase-portable.zip
      - name: Release (tags v* ou release publiée)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/E7Showcase-Setup-*.exe
            dist/E7Showcase-portable.zip
