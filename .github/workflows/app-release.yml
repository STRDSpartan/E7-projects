name: Application Windows

# Construit l'installateur Windows à chaque push sur la branche de travail ou sur main
# (artefact téléchargeable dans l'onglet Actions) et le publie en Release sur un tag v*.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[app]" pyinstaller
      - name: Vérification rapide
        run: python -c "import e7showcase.app.launcher, rapidocr_onnxruntime, webview"
      - name: Icône et images de l'installateur
        run: python scripts/make_icon.py packaging/windows/build
      - run: pyinstaller packaging/e7showcase-app.spec --noconfirm
      - name: Test de démarrage de l'exécutable
        shell: pwsh
        run: |
          $env:E7_DATA_DIR = "$env:RUNNER_TEMP\e7data"
          $p = Start-Process dist\E7Showcase\E7Showcase.exe -ArgumentList "--browser" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Get-Content "$env:E7_DATA_DIR\e7showcase.log" -ErrorAction SilentlyContinue; Write-Host "::error::l'exécutable s'est arrêté au démarrage"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path src/e7showcase/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Version : $version"
          $out = & $iscc "/DAppVersion=$version" packaging\windows\installer.iss 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $out | Select-Object -Last 15 | ForEach-Object { Write-Host "::error::iscc: $_" }
            exit $LASTEXITCODE
          }
      - name: Version portable (sans installation)
        shell: pwsh
        run: Compress-Archive -Path dist\E7Showcase -DestinationPath dist\E7Showcase-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: E7Showcase-Windows
          path: |
            dist/E7Showcase-Setup-*.exe
            dist/E7Showcase-portable.zip
      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/E7Showcase-Setup-*.exe
            dist/E7Showcase-portable.zip
