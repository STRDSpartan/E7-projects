[alembic]
script_location = alembic
prepend_sys_path = .
# L'URL vient de E7S_DATABASE_URL (voir alembic/env.py), jamais écrite ici.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
